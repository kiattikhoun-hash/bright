<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.js" integrity="sha384-iU8HYtnGQ8Cy4zl7gbNMOhsDTTKX02BTXptVP/vqAWIaTfM7isw76iyZCsjL2eVi" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>

<style>
:root{color-scheme:light;--bg:#f4f6fb;--panel:#fff;--border:#dde3ee;--border-soft:#eaeef5;--text:#0f172a;--text-2:#475569;--text-3:#7c869a;--accent:#142a5f;--accent-soft:#e2e8f4;--accent-2:#1e40af;--brand-amber:#f59e0b;--green:#10b981;--green-soft:#d1fae5;--amber:#f59e0b;--amber-soft:#fef3c7;--red:#ef4444;--red-soft:#fee2e2;--blue:#3b82f6;--blue-soft:#dbeafe;--purple:#8b5cf6;--purple-soft:#ede9fe;--pink:#ec4899;--pink-soft:#fce7f3;--gray-soft:#f1f4f9;--shadow-sm:0 1px 2px rgba(15,23,42,.05);--radius:14px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;min-height:100vh}
.sidebar{width:232px;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:0;height:100vh;flex-shrink:0;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;border-bottom:1px solid var(--border-soft);margin-bottom:14px}
.brand-logo{width:36px;height:36px;border-radius:9px;background:#142a5f;display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:4px}
.brand-logo svg{width:100%;height:100%;display:block}
.brand-name{font-weight:700;font-size:15px}.brand-sub{font-size:11px;color:var(--text-3)}
.nav-item{display:flex;align-items:center;gap:11px;padding:9px 10px;margin-bottom:2px;border-radius:9px;cursor:pointer;color:var(--text-2);font-weight:500;font-size:13.5px;user-select:none;transition:background .15s,color .15s}
.nav-item:hover{background:var(--gray-soft);color:var(--text)}.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item svg{width:17px;height:17px}
.nav-section{font-size:11px;text-transform:uppercase;color:var(--text-3);font-weight:600;padding:12px 10px 6px;letter-spacing:.04em}
.sidebar-footer{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--border-soft);display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:20}
.topbar-title{font-size:18px;font-weight:700}.topbar-sub{font-size:12px;color:var(--text-3);margin-top:2px}
.topbar-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.search{position:relative;display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:6px 10px 6px 32px;width:240px}
.search input{border:none;outline:none;background:transparent;width:100%;font-size:13px;color:var(--text)}
.search svg{position:absolute;left:10px;width:14px;height:14px;color:var(--text-3)}
.content{padding:22px 24px 80px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--panel);color:var(--text);transition:all .15s}
.btn:hover{background:var(--gray-soft)}.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-primary:hover{background:#4338ca}
.btn svg{width:14px;height:14px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow-sm)}
.kpi-label{font-size:12px;color:var(--text-3);font-weight:500}.kpi-value{font-size:22px;font-weight:700;margin-top:4px}
.kpi-delta{font-size:12px;margin-top:4px;display:inline-flex;align-items:center;gap:3px}.kpi-delta.up{color:var(--green)}.kpi-delta.down{color:var(--red)}
.kpi-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;float:right;margin-left:12px}.kpi-icon svg{width:18px;height:18px}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:18px;overflow:hidden;box-shadow:var(--shadow-sm)}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.panel-title{font-weight:700;font-size:14px}.panel-sub{font-size:12px;color:var(--text-3)}
.panel-body{padding:14px 18px}.panel-body.tight{padding:0}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-weight:600;color:var(--text-2);padding:10px 14px;background:var(--gray-soft);border-bottom:1px solid var(--border-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap;position:sticky;top:0;z-index:1}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--border-soft);vertical-align:middle}
table.tbl tr:hover td{background:#fafbfc}
.thumb{width:64px;height:64px;border-radius:8px;background:linear-gradient(135deg,var(--accent-soft),var(--purple-soft));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--accent);flex-shrink:0;border:1px solid var(--border-soft)}
.cust-cell{display:flex;align-items:center;gap:10px}.cust-name{font-weight:600}.cust-proj{font-size:11.5px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap}
.badge-check{background:var(--gray-soft);color:var(--text-2)}.badge-sample{background:var(--purple-soft);color:var(--purple)}.badge-prod{background:var(--blue-soft);color:var(--blue)}.badge-deliv{background:var(--amber-soft);color:var(--amber)}.badge-inv{background:var(--pink-soft);color:var(--pink)}.badge-done{background:var(--green-soft);color:var(--green)}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-left:auto}
.chip{padding:6px 11px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:12.5px;font-weight:500;cursor:pointer;user-select:none;color:var(--text-2)}
.chip:hover{background:var(--gray-soft)}.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.chip .count{opacity:.75;margin-left:4px;font-size:11px}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-bg.show{display:flex}
.modal{background:var(--panel);border-radius:16px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:center}
.modal-title{font-weight:700;font-size:16px}.modal-close{cursor:pointer;color:var(--text-3);font-size:22px;line-height:1;padding:4px}
.modal-body{padding:18px 22px}.modal-foot{padding:14px 22px;border-top:1px solid var(--border-soft);display:flex;gap:8px;justify-content:flex-end}
.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px}
.field .helper{font-size:11px;color:var(--text-3);margin-top:4px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;background:var(--panel);color:var(--text);outline:none;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field input[readonly],.field select[disabled]{background:var(--gray-soft);color:var(--text-2)}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.ac-wrap{position:relative}
.ac-list{position:absolute;top:100%;left:0;right:0;background:var(--panel);border:1px solid var(--border);border-radius:9px;margin-top:4px;max-height:240px;overflow-y:auto;z-index:50;box-shadow:0 8px 20px rgba(15,23,42,.12);display:none}
.ac-list.show{display:block}
.ac-item{padding:8px 12px;font-size:13.5px;cursor:pointer;color:var(--text);border-bottom:1px solid var(--border-soft)}
.ac-item:last-child{border-bottom:none}
.ac-item:hover,.ac-item.active{background:var(--accent-soft);color:var(--accent)}
.ac-item.ac-empty{color:var(--text-3);font-style:italic;cursor:default}
.ac-item.ac-empty:hover{background:transparent;color:var(--text-3)}
.note-box{background:var(--accent-soft);border:1px solid #c7d2fe;border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--accent);margin-bottom:14px}
.formula-box{background:#fffbeb;border:1px solid #fde68a;border-radius:9px;padding:12px 14px;font-size:12.5px;margin-bottom:14px;color:#92400e;line-height:1.6}
.formula-box code{background:#fef3c7;padding:1px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:#78350f}
.calc-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12.5px}.calc-divider{border-top:1px dashed var(--border);margin:6px 0}
.signature-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sig-box{border:1.5px dashed var(--border);border-radius:9px;padding:16px 12px;text-align:center;font-size:12px;color:var(--text-3);cursor:pointer}
.sig-box.signed{border-style:solid;background:var(--green-soft);border-color:var(--green);color:var(--green);font-weight:600}
.charts-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.chart-box{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-sm)}
.chart-box h3{font-size:13px;font-weight:700;margin:0 0 4px}.chart-box p{font-size:12px;color:var(--text-3);margin:0 0 12px}
.chart-canvas-wrap{position:relative;height:240px}
.delivery-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px}
.delivery-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.delivery-track{font-size:11px;color:var(--text-3);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.delivery-name{font-weight:700;font-size:15px;margin-top:2px}
.stage-track{display:flex;align-items:center;gap:0}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.stage:not(:last-child)::after{content:"";position:absolute;top:13px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0}
.stage.done:not(:last-child)::after{background:var(--green)}
.stage.active:not(:last-child)::after{background:var(--amber)}
.stage-dot{width:26px;height:26px;border-radius:50%;background:var(--gray-soft);border:2px solid var(--border);display:flex;align-items:center;justify-content:center;z-index:1;font-size:12px}
.stage.done .stage-dot{background:var(--green);border-color:var(--green);color:#fff}
.stage.active .stage-dot{background:var(--amber);border-color:var(--amber);color:#fff}
.stage-label{font-size:10.5px;font-weight:600;color:var(--text-2)}.stage-time{font-size:10px;color:var(--text-3)}
.mobile-tabbar{display:none}
@media(max-width:880px){.sidebar{display:none}.topbar{padding:12px 14px}.topbar-title{font-size:15px}.search{display:none}.content{padding:14px 12px 90px}.charts-grid{grid-template-columns:1fr}.field-row,.field-row-3{grid-template-columns:1fr}.panel-head{padding:12px 14px;gap:8px}.panel-body{padding:12px 14px}table.tbl th,table.tbl td{padding:8px 12px;font-size:12.5px}.filter-bar{width:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px}.chip{white-space:nowrap}.kpi-value{font-size:19px}.kpi{padding:14px}
.mobile-tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--border);padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -2px 12px rgba(15,23,42,.05)}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;color:var(--text-3);font-size:10.5px;font-weight:600;cursor:pointer}
.tab-item svg{width:19px;height:19px}.tab-item.active{color:var(--accent)}.hide-mobile{display:none!important}}
.deadline-cell{display:flex;flex-direction:column;gap:2px}.deadline-cell .days{font-size:11px;font-weight:600}
.days-ok{color:var(--green)}.days-warn{color:var(--amber)}.days-late{color:var(--red)}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:13px}
/* Analytics-style KPI cards & charts */
.an-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.an-kpi{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.an-kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bar-color,var(--accent))}
.an-kpi-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.an-kpi-label{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;font-weight:700}
.an-kpi-value{font-size:24px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.an-kpi-sub{font-size:11.5px;color:var(--text-3);margin-top:4px;font-weight:500}
.an-kpi-delta{font-size:11.5px;font-weight:700;margin-top:6px;display:inline-flex;align-items:center;gap:3px;font-variant-numeric:tabular-nums}
.an-grid-2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:18px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px;padding:0 2px}
.bar-row-label{flex:0 0 110px;font-size:12px;color:var(--text);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row-track{flex:1;height:16px;background:var(--gray-soft);border-radius:4px;overflow:hidden;position:relative;min-width:60px}
.bar-row-fill{height:100%;border-radius:4px;transition:width .4s ease}
.bar-row-val{flex:0 0 88px;text-align:right;font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.bar-row-val.muted{color:var(--text-3);font-weight:500}
.income-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border-soft)}
.income-row:last-child{border-bottom:none}
.income-row .lbl{flex:0 0 130px;font-size:12px;color:var(--text-2);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.income-row .track{flex:1;height:14px;background:var(--gray-soft);border-radius:7px;overflow:hidden;position:relative}
.income-row .fill{height:100%;border-radius:7px}
.income-row .val{flex:0 0 130px;text-align:right;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:880px){.an-grid-2{grid-template-columns:1fr}.bar-row-label{flex:0 0 90px}.bar-row-val{flex:0 0 70px}.income-row .lbl,.income-row .val{flex:0 0 90px;font-size:12px}}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border);border-radius:9px;overflow:hidden}
.cal-head{background:var(--gray-soft);padding:9px 6px;text-align:center;font-size:11px;font-weight:700;color:var(--text-2);text-transform:uppercase;letter-spacing:.04em}
.cal-cell{background:var(--panel);min-height:104px;padding:5px 6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;cursor:pointer;transition:background .12s}
.cal-cell:hover{background:#f0f4fc}
.cal-cell.cal-today:hover{background:#e3edff}
.cal-cell.cal-out{background:#fafbfd}
.cal-cell.cal-out:hover{background:#f1f4f9}
.cal-cell.cal-out .cal-date{color:var(--text-3);opacity:.6}
.cal-cell.cal-weekend:not(.cal-today){background:#f9fbff}
.cal-cell.cal-today{background:#eef4ff;box-shadow:inset 0 0 0 2px var(--accent)}
.cal-cell.cal-today .cal-date{background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px}
.cal-date{font-size:12px;font-weight:600;color:var(--text-2);align-self:flex-start}
.cal-task{padding:3px 6px;border-radius:5px;font-size:10.5px;cursor:pointer;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cal-task:hover{filter:brightness(.96)}
.cal-task .cal-task-kind{font-size:9px;font-weight:700;margin-right:3px;opacity:.85}
.cal-more{font-size:10px;color:var(--text-3);padding:0 6px;cursor:pointer}
.cal-more:hover{color:var(--accent)}
@media(max-width:880px){.cal-cell{min-height:62px;padding:3px}.cal-task{font-size:9.5px;padding:2px 4px}.cal-head{padding:6px 2px;font-size:9.5px}}

/* Quotation split-pane viewer ────────────────────────────────────────────── */
.qt-split{display:flex;gap:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;height:calc(100vh - 220px);min-height:520px}
.qt-pane-left{flex:0 0 320px;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#fafbfc;border-right:1px solid var(--border)}
.qt-pane-left.collapsed{flex-basis:0!important}
.qt-resizer{flex:0 0 6px;background:var(--border-soft);cursor:col-resize;position:relative;transition:background .15s}
.qt-resizer:hover,.qt-resizer.dragging{background:var(--accent)}
.qt-resizer::after{content:'';position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:2px;height:30px;background:var(--text-3);border-radius:2px;opacity:.4}
.qt-pane-right{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:#f1f3f6}
.qt-list-head{padding:12px 14px;border-bottom:1px solid var(--border);background:#fff;display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;color:var(--text-2)}
.qt-collapse-btn{margin-left:auto;background:transparent;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:11px;cursor:pointer;color:var(--text-2)}
.qt-collapse-btn:hover{background:var(--bg);color:var(--text)}
.qt-list{flex:1;overflow:auto;padding:6px 0}
.qt-customer{padding:7px 14px 4px;font-size:11px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;background:#f1f3f6;border-top:1px solid var(--border-soft);position:sticky;top:0;z-index:1}
.qt-customer:first-of-type{border-top:0}
.qt-file{display:flex;align-items:center;gap:8px;padding:8px 14px 8px 24px;cursor:pointer;font-size:12.5px;border-left:3px solid transparent;transition:background .12s,border-color .12s}
.qt-file:hover{background:#fff}
.qt-file.active{background:#fff;border-left-color:var(--accent);font-weight:600}
.qt-file-icon{width:14px;height:14px;flex-shrink:0;color:var(--text-3)}
.qt-file.kind-pdf .qt-file-icon{color:var(--red)}
.qt-file.kind-json .qt-file-icon{color:var(--blue)}
.qt-file-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt-file-meta{font-size:10.5px;color:var(--text-3);font-weight:400}
.qt-preview-head{padding:10px 14px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:12.5px}
.qt-preview-head strong{font-weight:600}
.qt-preview-body{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;background:#525659}
.qt-preview-body iframe{width:100%;height:100%;border:0;background:#fff}
.qt-pdf-host{width:100%;height:100%;overflow:auto;display:block;padding:14px;box-sizing:border-box}
.qt-pdf-host canvas{display:block;width:100%!important;height:auto!important;box-shadow:0 4px 16px rgba(0,0,0,.25);background:#fff;margin:0 auto 10px}
.qt-pdf-loading{color:#cbd5e1;font-size:13px;padding:30px;text-align:center}
.qt-preview-empty{color:#cbd5e1;font-size:13px;text-align:center;padding:40px}
.qt-bridge-status{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:5px}
.qt-bridge-status.ok{background:var(--green-soft);color:var(--green)}
.qt-bridge-status.err{background:#fee2e2;color:var(--red)}
.qt-line-row{display:grid;grid-template-columns:26px 76px 1fr 60px 96px 96px 90px 26px;gap:6px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--border-soft)}
.qt-line-row.header{font-weight:600;font-size:11px;text-transform:uppercase;color:var(--text-3);letter-spacing:.04em;border-bottom:1.5px solid var(--border)}
.qt-line-row textarea{min-height:36px;resize:none;overflow:hidden;font-family:inherit;font-size:12.5px;padding:6px 8px;line-height:1.45}
.qt-line-row input{font-size:12.5px;padding:6px 8px}
.qt-line-row .qt-line-amt{align-self:center;text-align:right;font-weight:600;color:var(--text)}
.qt-line-row .qt-line-del{background:transparent;border:0;color:var(--red);cursor:pointer;font-size:18px;align-self:center}
.qt-line-photo{width:78px;height:78px;border:1.5px dashed var(--border);border-radius:7px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:var(--bg);overflow:hidden;font-size:10.5px;color:var(--text-3);text-align:center;line-height:1.25}
.qt-line-photo img{width:100%;height:100%;object-fit:cover}
.qt-doc-types{display:flex;gap:6px;flex-wrap:wrap}
.qt-doc-types .chip{cursor:pointer}
@media(max-width:880px){.qt-split{flex-direction:column;height:auto}.qt-pane-left{flex-basis:auto!important;max-height:240px;border-right:0;border-bottom:1px solid var(--border)}.qt-resizer{display:none}.qt-line-row{grid-template-columns:1fr 1fr;gap:8px;padding:10px 0}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
@media(max-width:880px){.toast{bottom:80px}}
.admin-only{display:none!important}
body.admin-unlocked .nav-item.admin-only{display:flex!important}
body.admin-unlocked .tab-item.admin-only{display:flex!important}
.admin-lock-badge{display:inline-flex;align-items:center;padding:2px 6px;background:var(--amber-soft);color:var(--amber);border-radius:4px;font-size:10px;font-weight:700;margin-left:6px}
body.admin-unlocked .admin-lock-badge{background:var(--green-soft);color:var(--green)}

.sig-canvas-wrap{position:relative}
.sig-canvas{width:100%;height:90px;border:1.5px dashed var(--border);border-radius:9px;background:#fff;cursor:crosshair;touch-action:none;display:block}
.sig-canvas.signed{border-style:solid;border-color:var(--green)}
.sig-meta{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11.5px;color:var(--text-3)}
.sig-clear{cursor:pointer;color:var(--accent);font-weight:600;background:none;border:none;font-size:11.5px;padding:2px 6px}
.sig-clear:hover{text-decoration:underline}
.photo-wrap{display:flex;flex-direction:column;gap:8px}
.photo-preview{max-width:100%;max-height:200px;border-radius:9px;border:1px solid var(--border);object-fit:contain;background:#fafafa}
.photo-actions{display:flex;gap:8px;flex-wrap:wrap}
.photo-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;background:var(--bg);border:1px dashed var(--border);border-radius:9px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--text-2);user-select:none}
.photo-btn:hover{background:var(--gray-soft);color:var(--text)}
.photo-btn input{display:none}
.task-photo{width:64px;height:64px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--border-soft);cursor:pointer}
.cp-ready{background:var(--green-soft);border:1px solid var(--green);color:var(--green);padding:10px 12px;border-radius:9px;font-size:12.5px;margin-top:10px;display:flex;align-items:center;gap:8px;font-weight:600}
.cp-ready button{margin-left:auto}
</style>

      ]);
      if (s && s.error) console.warn('[supabase] statement view missing — run statement-view.sql', s.error.message);

        id: r.id, date: r.date, month: r.month,

        unit: r.unit, status: r.status,

      }));

      const remoteTeam = (tm.data || []).map(r => r.name).filter(Boolean);
      if (remoteTeam.length) TEAM = remoteTeam;

        id: r.id, project: r.project, description: r.description,
        unit: r.unit, price: r.price_yuan, sample: r.sample_yuan,
        status: r.status, date: r.date, dueDate: r.due_date, deadline: r.deadline,

      PRICES = (p.data || []).map(r => ({
        id: r.id, project: r.project, unit: r.unit,
        production: r.production_yuan, sample: r.sample_yuan, logistic: r.logistic_yuan,
        rateYuan: r.rate_yuan, sellPrice: r.sell_kip, status: r.status, date: r.date,
        customer: r.customers && r.customers.name
      }));
      DLV = (d.data || []).map(r => ({
        tracking: r.tracking, product: r.product,
        gzStatus: r.gz_status, gzTime: r.gz_time,
        planeStatus: r.plane_status, planeTime: r.plane_time,
        laoStatus: r.lao_status, laoTime: r.lao_time,

      }));
      console.log('[supabase] loaded', TASKS.length, 'tasks,', PRICES.length, 'prices,', DLV.length, 'deliveries');
    } catch(e) {
      console.error('[supabase] load failed', e);
      showToast('Connection error — check Supabase URL/key in source');
    }
  } else {
    // Fallback: localStorage + seed
    let saved = null;
    try { const raw = localStorage.getItem(STORAGE_KEY); if (raw) saved = JSON.parse(raw); } catch(e) {}
    TASKS  = saved ? saved.tasks  : SEED.T.map(t => expand(t, TKM));
    PRICES = saved ? saved.prices : SEED.P.map(p => expand(p, PKM));
    DLV    = saved ? saved.dlv    : JSON.parse(JSON.stringify(SEED.D));
    CUSTOMERS = [...new Set([...TASKS.map(t=>t.customer),...PRICES.map(p=>p.customer)].filter(Boolean))].sort();
  }
  if (!STATEMENT.length) {
    if (typeof SEED_STM !== 'undefined' && SEED_STM.length) {
      STATEMENT = SEED_STM.map(r => {
        const o = expand(r, SKM);
        o.month = (o.date||'').slice(0,7);
        return o;
      });
    } else {
      STATEMENT = deriveStatement(PRICES);
    }
  }
}

// Derive what the `statement` Supabase view would return, from a PRICES array.
// Used as a fallback when the view is missing or when running offline.
function deriveStatement(rows) {
  return rows.map(p => {
    const c = calcProfit(p);
    return {
      id: p.id, date: p.date, month: (p.date || '').slice(0, 7),
      customer: p.customer || '—', project: p.project,
      unit: p.unit, status: p.status,
      revenue: c.totalRevenue, profit: c.totalProfit,
    };
  });
}

// Reusable autocomplete dropdown — replaces native <datalist> for reliable behavior
// on every browser + mobile.  Shows all options on focus, filters as you type,
// click or Enter to select, allows new entries.
function setupAutocomplete(input, getItems) {
  if (!input || input._acBound) return;
  input._acBound = true;
  const wrap = input.closest('.ac-wrap');
  if (!wrap) return;

  const list = document.createElement('div');
  list.className = 'ac-list';
  wrap.appendChild(list);

  let highlight = -1;
  let visible = [];

  function render(filter) {
    const items = (getItems() || []).filter(it =>
      !filter || String(it).toLowerCase().includes(filter.toLowerCase())
    );
    visible = items;
    if (highlight >= items.length) highlight = items.length - 1;
    list.innerHTML = items.length
      ? items.map((it, i) => `<div class="ac-item ${i === highlight ? 'active' : ''}" data-i="${i}">${String(it).replace(/&/g,'&amp;').replace(/</g,'&lt;')}</div>`).join('')
      : '<div class="ac-item ac-empty">— type to add new —</div>';
  }

  function open() { render(input.value); list.classList.add('show'); }
  function close() { list.classList.remove('show'); highlight = -1; }
  function select(val) { input.value = val; close(); input.dispatchEvent(new Event('change', { bubbles: true })); }

  input.addEventListener('focus', () => { highlight = -1; open(); });
  input.addEventListener('click', () => { open(); });
  input.addEventListener('input', () => { highlight = -1; open(); });
  input.addEventListener('keydown', e => {
    if (!list.classList.contains('show')) {
      if (e.key === 'ArrowDown') { open(); e.preventDefault(); }
      return;
    }
    if (e.key === 'ArrowDown') { e.preventDefault(); highlight = Math.min(highlight + 1, visible.length - 1); render(input.value); scrollHighlightIntoView(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); highlight = Math.max(highlight - 1, -1); render(input.value); scrollHighlightIntoView(); }
    else if (e.key === 'Enter' && highlight >= 0 && visible[highlight]) { e.preventDefault(); select(visible[highlight]); }
    else if (e.key === 'Escape') { close(); }
    else if (e.key === 'Tab') { close(); }
  });
  function scrollHighlightIntoView() {
    const el = list.querySelector('.ac-item.active');
    if (el) el.scrollIntoView({ block: 'nearest' });
  }
  list.addEventListener('mousedown', e => {
    const item = e.target.closest('.ac-item');
    if (!item || item.classList.contains('ac-empty')) return;
    e.preventDefault();
    const i = parseInt(item.dataset.i, 10);
    if (visible[i] != null) select(visible[i]);
  });
  document.addEventListener('mousedown', e => { if (!wrap.contains(e.target)) close(); });
}

    price_yuan: data.price, sample_yuan: data.sample, status: data.status,

    photo_url: data.photoData || null, pic_sig_url: data.picSigData || null,
    approve_sig_url: data.approveSigData || null
  };
  const isNew = data.id.startsWith('new_');
  if (isNew) {
    const { data: ins, error } = await supa.from('follow_up_tasks').insert(row).select().single();

  }

const fmtKip = n => "₭"+Math.round(n||0).toLocaleString('en-US');
const fmtKipShort = n => { const v = Math.abs(n||0); if (v>=1e9) return "₭"+(n/1e9).toFixed(1)+"B"; if (v>=1e6) return "₭"+(n/1e6).toFixed(1)+"M"; if (v>=1e3) return "₭"+(n/1e3).toFixed(0)+"K"; return "₭"+(n||0); };
const fmtNum = n => (n||0).toLocaleString('en-US');
// Parse a YYYY-MM-DD string as a *local* date — avoids UTC-midnight drift that shifts the day
// in timezones west of UTC. All schedule/calendar logic must go through this.
const parseLocalDate = s => { if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtDate = s => { const d=parseLocalDate(s); return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : "—"; };
const fmtDateShort = s => { const d=parseLocalDate(s); return d ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'}) : "—"; };
// today in YYYY-MM-DD using local timezone (matches what <input type="date"> expects)
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const TODAY = parseLocalDate(todayISO());
const daysUntil = s => { const d=parseLocalDate(s); return d ? Math.round((d-TODAY)/(1000*60*60*24)) : null; };
const initials = s => (s||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase();

function calcProfit(p) {
  const unit = p.unit || 0;
  const samplePerUnitYuan = unit > 0 ? (p.sample || 0) / unit : 0;
  const costPerUnitYuan = (p.production || 0) + samplePerUnitYuan + (p.logistic || 0);
  const rate = p.rateYuan || 0;
  const costPerUnitKip = costPerUnitYuan * rate;
  const profitPerUnit = (p.sellPrice || 0) - costPerUnitKip;
  const totalProfit = profitPerUnit * unit;
  const totalRevenue = (p.sellPrice || 0) * unit;
  const margin = totalRevenue > 0 ? (totalProfit / totalRevenue * 100) : 0;
  return { samplePerUnitYuan, costPerUnitYuan, costPerUnitKip, profitPerUnit, totalProfit, totalRevenue, margin };
}

      <h2 style="margin:0 0 4px;font-size:18px;font-weight:700;">Admin Access Required</h2>
      <p style="margin:0 0 22px;color:var(--text-3);font-size:13px;">Enter PIN to unlock Dashboard &amp; Product Price</p>
      <input id="pin-input" type="password" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="off" style="width:100%;padding:14px;text-align:center;font-size:22px;letter-spacing:8px;border:1px solid var(--border);border-radius:9px;outline:none;font-family:ui-monospace,monospace;background:var(--bg);" onkeydown="if(event.key==='Enter')checkPin()" />
      <div id="pin-error" style="margin-top:8px;font-size:12px;color:var(--red);min-height:16px;font-weight:500;"></div>
      <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:6px;" onclick="checkPin()">Unlock</button>
    </div>`;
  setTimeout(() => { const inp=document.getElementById('pin-input'); if (inp) inp.focus(); }, 50);
}
function checkPin() {
  const inp = document.getElementById('pin-input');
  if (inp.value === ADMIN_PIN) {
    adminUnlocked = true;
    document.body.classList.add('admin-unlocked');
    const badge = document.getElementById('admin-lock-status');
    if (badge) badge.textContent = '🔓';
    setView('dashboard');
    showToast('Admin unlocked');
  } else {
    document.getElementById('pin-error').textContent = 'Incorrect PIN';
    inp.value = ''; inp.focus();
  }
}
function bindNav() {
  document.querySelectorAll('[data-view]').forEach(el => {
    el.addEventListener('click', () => setView(el.dataset.view));
  });
}

function render() {
  const doneCount = STATEMENT.filter(r => r.status === 'Done').length;
  const scheduledCount = TASKS.filter(t => t.status !== 'Invoice' && t.status !== 'Invoices' && t.status !== 'Done' && (t.dueDate || t.deadline)).length;
  const titles = { dashboard:["Dashboard","Tuesday, April 28, 2026"], tasks:["Follow-up Tasks", `${TASKS.length} items`], schedule:["Follow-up Schedule", `${scheduledCount} tasks with due/deadline dates`], quotations:["Quotations", `${QUOTATIONS.length} record${QUOTATIONS.length===1?'':'s'} · ${quotationFileCount()} file${quotationFileCount()===1?'':'s'} on disk`], prices:["Product Price", `${PRICES.filter(p=>p.status!=='Done').length} active items`], statement:["Financial Statement", `${doneCount} completed jobs`], delivery:["Delivery", `${DLV.length} active shipments`], customers:["Customers", `${CUSTOMERS.length} accounts`], team:["Team", `${TEAM.length} PIC`] };
  document.getElementById('page-title').textContent = titles[currentView][0];
  document.getElementById('page-sub').textContent  = titles[currentView][1];
  const addBtn = document.getElementById('header-add-btn');
  addBtn.style.display = (currentView==='tasks'||currentView==='prices'||currentView==='delivery'||currentView==='quotations') ? '' : 'none';
  const lbl = currentView==='prices'?'New Price':currentView==='delivery'?'New Shipment':currentView==='quotations'?'New Quotation':'New Task';
  addBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>'+lbl;
  addBtn.onclick = () => currentView==='prices' ? openPriceModal() : currentView==='delivery' ? openDeliveryModal() : currentView==='quotations' ? openQuotationModal() : openTaskModal();
  if (currentView==="dashboard") renderDashboard();
  if (currentView==="tasks")     renderTasks();
  if (currentView==="schedule")  renderSchedule();
  if (currentView==="quotations") renderQuotations();
  if (currentView==="prices")    renderPrices();
  if (currentView==="statement") renderStatement();
  if (currentView==="delivery")  renderDelivery();
  if (currentView==="customers") renderCustomers();
  if (currentView==="team")      renderTeam();
}

function renderDashboard() {
  // Aggregate the Supabase `statement` view — every row is one project entry.
  const totalRev  = STATEMENT.reduce((s,r)=> s + r.revenue, 0);
  const totalProf = STATEMENT.reduce((s,r)=> s + r.profit,  0);
  const margin    = totalRev>0 ? (totalProf/totalRev*100) : 0;

  // ── Done vs Pipeline split ──────────────────────────
  const done = STATEMENT.filter(r => r.status === 'Done');
  const pipeline = STATEMENT.filter(r => r.status !== 'Done');
  const doneRev  = done.reduce((s,r)=> s + r.revenue, 0);
  const doneProf = done.reduce((s,r)=> s + r.profit,  0);
  const pipeRev  = pipeline.reduce((s,r)=> s + r.revenue, 0);
  const pipeProf = pipeline.reduce((s,r)=> s + r.profit,  0);
  const avgDeal  = STATEMENT.length>0 ? totalRev/STATEMENT.length : 0;
  const profitable = STATEMENT.filter(r => r.profit > 0).length;
  const losing     = STATEMENT.filter(r => r.profit < 0).length;

  // ── Status breakdown ────────────────────────────────
  const byStatus = {};
  STATEMENT.forEach(r => {
    const k = r.status || '—';
    (byStatus[k] = byStatus[k] || {revenue:0, profit:0, count:0});
    byStatus[k].revenue += r.revenue;
    byStatus[k].profit  += r.profit;
    byStatus[k].count   += 1;
  });
  const STATUS_ORDER = ['Done','Production','Sample','Quotation'];
  const statusRows = STATUS_ORDER.filter(s => byStatus[s]).map(s => ({status:s, ...byStatus[s]}));

  // ── By Customer ─────────────────────────────────────
  const byCust = {};
  STATEMENT.forEach(r => {
    const k = r.customer || '—';
    (byCust[k] = byCust[k] || {revenue:0, profit:0, count:0});
    byCust[k].revenue += r.revenue;
    byCust[k].profit  += r.profit;
    byCust[k].count   += 1;
  });
  const custRows = Object.entries(byCust)
    .map(([name,v]) => ({name, ...v, margin: v.revenue>0 ? v.profit/v.revenue*100 : 0, avg: v.count>0 ? v.revenue/v.count : 0}))
    .sort((a,b) => b.revenue - a.revenue);

  // ── By Month (with per-customer breakdown for detail table) ──
  const byMonth = {};
  STATEMENT.forEach(r => {
    if (!r.month) return;
    if (!byMonth[r.month]) byMonth[r.month] = { revenue:0, profit:0, count:0, profitable:0, losing:0, custs:{} };
    const mb = byMonth[r.month];
    mb.revenue += r.revenue;
    mb.profit  += r.profit;
    mb.count   += 1;
    if (r.profit > 0) mb.profitable += 1;
    else if (r.profit < 0) mb.losing += 1;
    const ck = r.customer || '—';
    if (!mb.custs[ck]) mb.custs[ck] = { revenue:0, profit:0 };
    mb.custs[ck].revenue += r.revenue;
    mb.custs[ck].profit  += r.profit;
  });
  // sort ascending so we can compute prev-month delta, then reverse for display
  const monthAsc = Object.entries(byMonth)
    .map(([m,v]) => {
      const margin = v.revenue>0 ? v.profit/v.revenue*100 : 0;
      const cost = v.revenue - v.profit;
      const avg  = v.count>0 ? v.revenue/v.count : 0;
      const customers = Object.keys(v.custs).length;
      const top = Object.entries(v.custs).sort((a,b)=> b[1].revenue - a[1].revenue)[0];
      return { month:m, revenue:v.revenue, profit:v.profit, count:v.count,
               profitable:v.profitable, losing:v.losing,
               margin, cost, avg, customers,
               topCust: top ? top[0] : '—', topCustRev: top ? top[1].revenue : 0 };
    })
    .sort((a,b) => a.month.localeCompare(b.month));
  monthAsc.forEach((m, i) => {
    const prev = monthAsc[i-1];
    m.deltaProfit = prev && prev.profit !== 0 ? ((m.profit - prev.profit) / Math.abs(prev.profit) * 100) : null;
    m.deltaRev    = prev && prev.revenue !== 0 ? ((m.revenue - prev.revenue) / Math.abs(prev.revenue) * 100) : null;
  });
  const monthRows = monthAsc.slice().reverse();

  // ── By Year (YoY) ───────────────────────────────────
  const byYear = {};
  STATEMENT.forEach(r => {
    const y = (r.month || '').slice(0,4);
    if (!y) return;
    (byYear[y] = byYear[y] || {revenue:0, profit:0, count:0});
    byYear[y].revenue += r.revenue;
    byYear[y].profit  += r.profit;
    byYear[y].count   += 1;
  });
  const yearRows = Object.entries(byYear)
    .map(([y,v]) => ({year:y, ...v, margin: v.revenue>0 ? v.profit/v.revenue*100 : 0}))
    .sort((a,b) => b.year.localeCompare(a.year));

  // ── Top products / projects ─────────────────────────
  const byProj = {};
  STATEMENT.forEach(r => {
    const k = r.project || '—';
    (byProj[k] = byProj[k] || {revenue:0, profit:0, count:0});
    byProj[k].revenue += r.revenue;
    byProj[k].profit  += r.profit;
    byProj[k].count   += 1;
  });
  const projRows = Object.entries(byProj)
    .map(([name,v]) => ({name, ...v, margin: v.revenue>0 ? v.profit/v.revenue*100 : 0}))
    .sort((a,b) => b.profit - a.profit)
    .slice(0,10);

  // ── Highlights ──────────────────────────────────────
  const bestMonth = monthRows.slice().sort((a,b)=> b.profit - a.profit)[0];
  const topCustomer = custRows[0];
  const biggestDeal = STATEMENT.slice().sort((a,b)=> b.revenue - a.revenue)[0];
  const worstDeal   = STATEMENT.slice().sort((a,b)=> a.profit  - b.profit)[0];

  // Trend data: last 12 months in chronological order
  const trend = monthRows.slice().sort((a,b) => a.month.localeCompare(b.month)).slice(-12);

  // YoY deltas (used in KPI cards)
  const pct = (a,b) => b>0 ? ((a-b)/b*100) : (b===0 && a>0 ? 100 : 0);
  const cur  = yearRows[0] || null;
  const prev = yearRows[1] || null;
  const dRev  = (cur && prev) ? pct(cur.revenue, prev.revenue) : null;
  const dProf = (cur && prev) ? pct(cur.profit,  prev.profit)  : null;

  // Sparkline data: last 12 months in chronological order (already = trend)
  const sparkRev  = trend.map(t => t.revenue);
  const sparkProf = trend.map(t => t.profit);
  const sparkMargin = trend.map(t => t.margin);

  const arrow = v => v >= 0 ? '▲' : '▼';
  const dCol  = v => v >= 0 ? 'var(--green)' : 'var(--red)';
  const deltaPill = v => v === null ? '<span style="color:var(--text-3);">no prior data</span>'
    : `<span style="color:${dCol(v)};">${arrow(v)} ${Math.abs(v).toFixed(1)}% YoY</span>`;

  const yoyHtml = (cur && prev) ? `<div class="panel">
      <div class="panel-head"><div><div class="panel-title">Year over Year</div><div class="panel-sub">${cur.year} vs ${prev.year}</div></div></div>
      <div class="panel-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;">
        <div><div class="an-kpi-label">${cur.year} Revenue</div><div style="font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;">${fmtKipShort(cur.revenue)}</div><div class="an-kpi-delta" style="color:${dCol(dRev)};">${arrow(dRev)} ${Math.abs(dRev).toFixed(1)}% vs ${prev.year}</div></div>
        <div><div class="an-kpi-label">${cur.year} Profit</div><div style="font-size:18px;font-weight:700;margin-top:4px;color:${cur.profit>=0?'var(--green)':'var(--red)'};font-variant-numeric:tabular-nums;">${fmtKipShort(cur.profit)}</div><div class="an-kpi-delta" style="color:${dCol(dProf)};">${arrow(dProf)} ${Math.abs(dProf).toFixed(1)}% vs ${prev.year}</div></div>
        <div><div class="an-kpi-label">${cur.year} Margin</div><div style="font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;">${cur.margin.toFixed(1)}%</div><div class="an-kpi-sub">prev: ${prev.margin.toFixed(1)}%</div></div>
        <div><div class="an-kpi-label">${cur.year} Entries</div><div style="font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums;">${cur.count}</div><div class="an-kpi-sub">prev: ${prev.count}</div></div>
      </div>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="an-grid">
      <div class="an-kpi" style="--bar-color:var(--accent);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Total Revenue</div><div class="an-kpi-value">${fmtKipShort(totalRev)}</div></div>
          ${sparkLine(sparkRev,'#142a5f','rgba(20,42,95,.14)')}
        </div>
        <div class="an-kpi-delta">${deltaPill(dRev)}<span style="color:var(--text-3);font-weight:500;margin-left:6px;">· ${STATEMENT.length} entries</span></div>
      </div>
      <div class="an-kpi" style="--bar-color:${totalProf>=0?'var(--green)':'var(--red)'};">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Total Profit</div><div class="an-kpi-value" style="color:${totalProf>=0?'var(--green)':'var(--red)'};">${fmtKipShort(totalProf)}</div></div>
          ${sparkLine(sparkProf,'#10b981','rgba(16,185,129,.16)')}
        </div>
        <div class="an-kpi-delta">${deltaPill(dProf)}<span style="color:var(--text-3);font-weight:500;margin-left:6px;">· margin ${margin.toFixed(1)}%</span></div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--green);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Recognised (Done)</div><div class="an-kpi-value" style="color:var(--green);">${fmtKipShort(doneRev)}</div></div>
        </div>
        <div class="an-kpi-sub">${done.length} jobs · profit <strong style="color:var(--green);">${fmtKipShort(doneProf)}</strong></div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--amber);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Pipeline (open)</div><div class="an-kpi-value" style="color:var(--amber);">${fmtKipShort(pipeRev)}</div></div>
        </div>
        <div class="an-kpi-sub">${pipeline.length} in progress · expected profit <strong>${fmtKipShort(pipeProf)}</strong></div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--blue);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Avg Deal Size</div><div class="an-kpi-value">${fmtKipShort(avgDeal)}</div></div>
        </div>
        <div class="an-kpi-sub">${profitable} 🟢 profitable · ${losing} 🔴 loss</div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--purple);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Customers</div><div class="an-kpi-value">${custRows.length}</div></div>
        </div>
        <div class="an-kpi-sub">Top: <strong>${topCustomer ? topCustomer.name : '—'}</strong>${topCustomer?` · ${fmtKipShort(topCustomer.revenue)}`:''}</div>
      </div>
    </div>

    <div class="an-grid-2">
      <div class="chart-box">
        <h3>Monthly Revenue &amp; Profit</h3>
        <p>Last ${trend.length} months · trend</p>
        <div class="chart-canvas-wrap" style="height:300px;"><canvas id="trend-chart"></canvas></div>
      </div>
      <div class="chart-box">
        <h3>Revenue by Status</h3>
        <p>Pipeline composition · ₭ in millions</p>
        <div class="chart-canvas-wrap" style="height:300px;"><canvas id="status-donut"></canvas></div>
      </div>
    </div>

    <div class="chart-box" style="margin-bottom:18px;">
      <h3>Top 10 Customers</h3>
      <p>Sorted by revenue · profit shown to the right</p>
      <div style="margin-top:10px;">${topCustomersBarsHtml(custRows, 10)}</div>
    </div>

    ${yoyHtml}

    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Top 10 Products</div><div class="panel-sub">By project name · sorted by profit</div></div></div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Project</th><th class="hide-mobile">Entries</th><th>Revenue</th><th>Profit</th><th class="hide-mobile">Margin</th></tr></thead>
        <tbody>${projRows.map(r => `<tr>
          <td><div class="cust-cell"><div class="thumb">${initials(r.name)}</div><div class="cust-name">${r.name}</div></div></td>
          <td class="hide-mobile">${r.count}</td>
          <td style="font-variant-numeric:tabular-nums;"><strong>${fmtKipShort(r.revenue)}</strong></td>
          <td style="color:${r.profit>=0?'var(--green)':'var(--red)'};font-weight:600;font-variant-numeric:tabular-nums;">${fmtKipShort(r.profit)}</td>
          <td class="hide-mobile">${r.margin.toFixed(1)}%</td>
        </tr>`).join('') || '<tr><td colspan="5" class="empty">No data</td></tr>'}</tbody>
      </table></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Monthly Breakdown</div><div class="panel-sub">${monthRows.length} months · revenue, cost, profit, customers &amp; vs-prev delta</div></div></div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th>Month</th>
          <th class="hide-mobile">Entries</th>
          <th class="hide-mobile">Customers</th>
          <th>Revenue</th>
          <th class="hide-mobile">Cost</th>
          <th>Profit</th>
          <th class="hide-mobile">Margin</th>
          <th class="hide-mobile">Avg Deal</th>
          <th class="hide-mobile">vs prev</th>
          <th class="hide-mobile">Top customer</th>
        </tr></thead>
        <tbody>${monthRows.map(r => {
          const dArrow = r.deltaProfit === null ? '—' : (r.deltaProfit >= 0 ? '▲' : '▼');
          const dCol = r.deltaProfit === null ? 'var(--text-3)' : (r.deltaProfit >= 0 ? 'var(--green)' : 'var(--red)');
          const dTxt = r.deltaProfit === null ? '—' : `${dArrow} ${Math.abs(r.deltaProfit).toFixed(0)}%`;
          return `<tr>
            <td><strong>${r.month}</strong></td>
            <td class="hide-mobile">${r.count} <span style="color:var(--text-3);font-size:11px;">(${r.profitable}🟢 ${r.losing}🔴)</span></td>
            <td class="hide-mobile">${r.customers}</td>
            <td><strong>${fmtKipShort(r.revenue)}</strong></td>
            <td class="hide-mobile" style="color:var(--text-2);">${fmtKipShort(r.cost)}</td>
            <td style="color:${r.profit>=0?'var(--green)':'var(--red)'};font-weight:600;">${fmtKipShort(r.profit)}</td>
            <td class="hide-mobile">${r.margin.toFixed(1)}%</td>
            <td class="hide-mobile" style="color:var(--text-2);">${fmtKipShort(r.avg)}</td>
            <td class="hide-mobile" style="color:${dCol};font-weight:600;">${dTxt}</td>
            <td class="hide-mobile" style="font-size:11.5px;color:var(--text-2);">${r.topCust} <span style="color:var(--text-3);">(${fmtKipShort(r.topCustRev)})</span></td>
          </tr>`;
        }).join('') || '<tr><td colspan="10" class="empty">No statement rows</td></tr>'}</tbody>
      </table></div></div>
    </div>

    ${biggestDeal || worstDeal ? `<div class="panel">
      <div class="panel-head"><div><div class="panel-title">Highlights</div><div class="panel-sub">Notable single entries</div></div></div>
      <div class="panel-body" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;">
        ${biggestDeal ? `<div style="border-left:3px solid var(--green);padding:8px 12px;background:var(--bg);border-radius:6px;">

          <div style="font-size:12.5px;color:var(--text-3);">${fmtDateShort(biggestDeal.date)} · ${fmtNum(biggestDeal.unit)} units</div>
          <div style="margin-top:4px;font-weight:700;">${fmtKipShort(biggestDeal.revenue)} <span style="color:var(--green);">profit ${fmtKipShort(biggestDeal.profit)}</span></div>
        </div>`:''}
        ${worstDeal && worstDeal.profit < 0 ? `<div style="border-left:3px solid var(--red);padding:8px 12px;background:var(--bg);border-radius:6px;">

          <div style="font-weight:700;margin-top:2px;">${worstDeal.project} · ${worstDeal.customer}</div>

          <div style="margin-top:4px;font-weight:700;">${fmtKipShort(worstDeal.revenue)} <span style="color:var(--red);">profit ${fmtKipShort(worstDeal.profit)}</span></div>
        </div>`:''}
        ${bestMonth ? `<div style="border-left:3px solid var(--accent);padding:8px 12px;background:var(--bg);border-radius:6px;">
          <div style="font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;">Best Month</div>
          <div style="font-weight:700;margin-top:2px;">${bestMonth.month}</div>
          <div style="font-size:12.5px;color:var(--text-3);">${bestMonth.count} entries · margin ${bestMonth.margin.toFixed(1)}%</div>
          <div style="margin-top:4px;font-weight:700;">${fmtKipShort(bestMonth.revenue)} <span style="color:var(--green);">profit ${fmtKipShort(bestMonth.profit)}</span></div>
        </div>`:''}
      </div>
    </div>`:''}`;

  drawTrendChart(trend);

function drawTrendChart(trend) {
  const el = document.getElementById('trend-chart');
  if (!el || typeof Chart === 'undefined' || !trend.length) return;
  const labels = trend.map(t => t.month);
  const revenue = trend.map(t => Math.round(t.revenue / 1e6));
  const profit  = trend.map(t => Math.round(t.profit  / 1e6));
  const ctx = el.getContext('2d');
  // Soft fills under each line
  const revFill = ctx.createLinearGradient(0,0,0,260); revFill.addColorStop(0,'rgba(79,70,229,.18)'); revFill.addColorStop(1,'rgba(79,70,229,0)');
  const profFill= ctx.createLinearGradient(0,0,0,260); profFill.addColorStop(0,'rgba(16,185,129,.20)'); profFill.addColorStop(1,'rgba(16,185,129,0)');
  charts.trend = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [
        { label:'Revenue', data:revenue, borderColor:'#4f46e5', backgroundColor:revFill, borderWidth:2, tension:.35, fill:true, pointRadius:0, pointHoverRadius:4, pointHoverBackgroundColor:'#4f46e5' },

// ───── Analytics helpers (inline SVG sparklines + Chart.js donut/cumulative) ─────
function sparkLine(values, stroke, fill, w=92, h=30) {
  if (!values || !values.length) return '';
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = (w - 2) / Math.max(1, values.length - 1);
  const pts = values.map((v, i) => {
    const x = 1 + i * step;
    const y = h - 1 - ((v - min) / range) * (h - 4);
    return [x, y];
  });
  const lp = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const ap = lp + ` L${pts.at(-1)[0].toFixed(1)},${h} L${pts[0][0].toFixed(1)},${h} Z`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;flex-shrink:0;">
    ${fill ? `<path d="${ap}" fill="${fill}"/>` : ''}
    <path d="${lp}" fill="none" stroke="${stroke}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

function drawCumulativeChart(canvasId, monthAsc) {
  const el = document.getElementById(canvasId);
  if (!el || !monthAsc.length || typeof Chart === 'undefined') return;
  let cumRev = 0, cumProf = 0;
  const labels = monthAsc.map(m => m.month);
  const revData = monthAsc.map(m => { cumRev += m.revenue; return Math.round(cumRev/1e6); });
  const profData = monthAsc.map(m => { cumProf += m.profit; return Math.round(cumProf/1e6); });
  const ctx = el.getContext('2d');
  const grad1 = ctx.createLinearGradient(0,0,0,260); grad1.addColorStop(0,'rgba(20,42,95,.18)'); grad1.addColorStop(1,'rgba(20,42,95,0)');
  const grad2 = ctx.createLinearGradient(0,0,0,260); grad2.addColorStop(0,'rgba(16,185,129,.22)'); grad2.addColorStop(1,'rgba(16,185,129,0)');
  charts[canvasId] = new Chart(el, {
    type: 'line',
    data: { labels, datasets: [
      { label:'Cumulative Revenue', data:revData, borderColor:'#142a5f', backgroundColor:grad1, borderWidth:2, tension:.3, fill:true, pointRadius:0, pointHoverRadius:4 },
      { label:'Cumulative Profit',  data:profData, borderColor:'#10b981', backgroundColor:grad2, borderWidth:2, tension:.3, fill:true, pointRadius:0, pointHoverRadius:4 }
    ]},
    options: {
      responsive:true, maintainAspectRatio:false,
      interaction:{ mode:'index', intersect:false },
      plugins: {
        legend: { position:'top', align:'end', labels:{ usePointStyle:true, pointStyle:'circle', boxWidth:8, font:{ size:11.5 }, color:'#475569' } },
        tooltip: { backgroundColor:'#0f172a', padding:10, displayColors:false, callbacks:{ label: c => ` ${c.dataset.label}: ₭${c.parsed.y.toLocaleString()}M` } }
      },
      scales: {
        x: { grid:{ display:false }, ticks:{ color:'#7c869a', font:{ size:11 } }, border:{ display:false } },
        y: { grid:{ color:'rgba(221,227,238,.6)' }, ticks:{ color:'#7c869a', font:{ size:11 }, callback: v => '₭'+v+'M' }, border:{ display:false } }
      }
    }
  });
}

function topCustomersBarsHtml(rows, max=10) {
  const top = rows.slice(0, max);
  if (!top.length) return '<div class="empty">No data</div>';
  const maxRev = Math.max(...top.map(r => r.revenue));
  return top.map(r => {
    const pct = Math.max(2, (r.revenue / maxRev) * 100);
    const fillCol = r.profit >= 0
      ? 'linear-gradient(90deg,#142a5f,#1e40af)'
      : 'linear-gradient(90deg,#dc2626,#ef4444)';
    return `<div class="bar-row" title="${(r.name||'').replace(/"/g,'&quot;')}: ${fmtKipShort(r.revenue)} revenue · ${fmtKipShort(r.profit)} profit">
      <div class="bar-row-label">${r.name||'—'}</div>
      <div class="bar-row-track"><div class="bar-row-fill" style="width:${pct}%;background:${fillCol};"></div></div>
      <div class="bar-row-val">${fmtKipShort(r.revenue)}</div>
      <div class="bar-row-val muted" style="color:${r.profit>=0?'var(--green)':'var(--red)'};">${fmtKipShort(r.profit)}</div>
    </div>`;
  }).join('');
}

function renderStatement() {
  // All "Done" rows from the statement view = company financial statement.
  const done = STATEMENT.filter(r => r.status === 'Done');
  const totalRev  = done.reduce((s,r)=> s + r.revenue, 0);
  const totalProf = done.reduce((s,r)=> s + r.profit,  0);
  const margin = totalRev>0 ? (totalProf/totalRev*100) : 0;

  // Detailed monthly aggregation (Done jobs only)
  const byMonth = {};
  done.forEach(r => {
    if (!r.month) return;
    if (!byMonth[r.month]) byMonth[r.month] = { revenue:0, profit:0, count:0, profitable:0, losing:0, custs:{} };
    const mb = byMonth[r.month];
    mb.revenue += r.revenue;
    mb.profit  += r.profit;
    mb.count   += 1;
    if (r.profit > 0) mb.profitable += 1;
    else if (r.profit < 0) mb.losing += 1;
    const ck = r.customer || '—';
    if (!mb.custs[ck]) mb.custs[ck] = { revenue:0, profit:0 };
    mb.custs[ck].revenue += r.revenue;
    mb.custs[ck].profit  += r.profit;
  });
  const monthAsc = Object.entries(byMonth)
    .map(([m,v]) => {
      const margin = v.revenue>0 ? v.profit/v.revenue*100 : 0;
      const cost = v.revenue - v.profit;
      const avg  = v.count>0 ? v.revenue/v.count : 0;
      const customers = Object.keys(v.custs).length;
      const top = Object.entries(v.custs).sort((a,b)=> b[1].revenue - a[1].revenue)[0];
      return { month:m, revenue:v.revenue, profit:v.profit, count:v.count,
               profitable:v.profitable, losing:v.losing,
               margin, cost, avg, customers,
               topCust: top ? top[0] : '—', topCustRev: top ? top[1].revenue : 0 };
    })
    .sort((a,b) => a.month.localeCompare(b.month));
  monthAsc.forEach((m, i) => {
    const prev = monthAsc[i-1];
    m.deltaProfit = prev && prev.profit !== 0 ? ((m.profit - prev.profit) / Math.abs(prev.profit) * 100) : null;
    m.deltaRev    = prev && prev.revenue !== 0 ? ((m.revenue - prev.revenue) / Math.abs(prev.revenue) * 100) : null;
  });
  const monthRows = monthAsc.slice().reverse();

  const lineItems = done.slice().sort((a,b) => (b.date||'').localeCompare(a.date||''));

  // Total cost across all Done rows = revenue minus profit
  const totalCost = totalRev - totalProf;
  // Avg deal + monthly velocity (last 12 mo)
  const avgDealFS = done.length > 0 ? totalRev / done.length : 0;
  const last12 = monthAsc.slice(-12);
  const last12Rev  = last12.reduce((s,m) => s + m.revenue, 0);
  const last12Prof = last12.reduce((s,m) => s + m.profit,  0);
  // Sparkline series for the Statement KPIs (last 12 months)
  const fsSparkRev  = last12.map(m => m.revenue);
  const fsSparkProf = last12.map(m => m.profit);
  // Income-statement bar widths (Revenue is 100%; Cost & Profit relative to it)
  const costPct   = totalRev > 0 ? Math.max(0, Math.min(100, (totalCost  / totalRev) * 100)) : 0;
  const profitPct = totalRev > 0 ? Math.max(0, Math.min(100, (totalProf  / totalRev) * 100)) : 0;
  // Monthly aggregation for the cumulative chart — current year only when we have one
  const curYear = (monthAsc[monthAsc.length-1]?.month || todayISO()).slice(0,4);
  const cumMonths = monthAsc.filter(m => m.month.startsWith(curYear));

  document.getElementById('content').innerHTML = `
    <div class="an-grid">
      <div class="an-kpi" style="--bar-color:var(--accent);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Total Revenue</div><div class="an-kpi-value">${fmtKipShort(totalRev)}</div></div>
          ${sparkLine(fsSparkRev,'#142a5f','rgba(20,42,95,.14)')}
        </div>
        <div class="an-kpi-sub">${done.length} completed jobs · last 12 mo: ${fmtKipShort(last12Rev)}</div>
      </div>
      <div class="an-kpi" style="--bar-color:${totalProf>=0?'var(--green)':'var(--red)'};">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Total Profit</div><div class="an-kpi-value" style="color:${totalProf>=0?'var(--green)':'var(--red)'};">${fmtKipShort(totalProf)}</div></div>
          ${sparkLine(fsSparkProf,'#10b981','rgba(16,185,129,.16)')}
        </div>
        <div class="an-kpi-sub">last 12 mo profit: <strong>${fmtKipShort(last12Prof)}</strong></div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--blue);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Gross Margin</div><div class="an-kpi-value" style="color:${margin>=0?'var(--green)':'var(--red)'};">${margin.toFixed(1)}%</div></div>
        </div>
        <div class="an-kpi-sub">cost / revenue ratio: ${totalRev>0 ? ((totalCost/totalRev)*100).toFixed(1) : '0.0'}%</div>
      </div>
      <div class="an-kpi" style="--bar-color:var(--purple);">
        <div class="an-kpi-head">
          <div><div class="an-kpi-label">Avg Deal</div><div class="an-kpi-value">${fmtKipShort(avgDealFS)}</div></div>
        </div>
        <div class="an-kpi-sub">Done jobs only · ${monthAsc.length} months tracked</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Income Statement</div><div class="panel-sub">All recognised (Done) revenue, cost &amp; profit</div></div></div>
      <div class="panel-body" style="padding:6px 18px;">
        <div class="income-row">
          <div class="lbl" style="color:var(--accent);">Revenue</div>
          <div class="track"><div class="fill" style="width:100%;background:linear-gradient(90deg,#142a5f,#1e40af);"></div></div>
          <div class="val">${fmtKipShort(totalRev)}</div>
        </div>
        <div class="income-row">
          <div class="lbl" style="color:var(--red);">− Cost</div>
          <div class="track"><div class="fill" style="width:${costPct}%;background:linear-gradient(90deg,#dc2626,#ef4444);"></div></div>
          <div class="val" style="color:var(--red);">${fmtKipShort(totalCost)}</div>
        </div>
        <div class="income-row" style="border-top:2px solid var(--border-soft);">
          <div class="lbl" style="color:${totalProf>=0?'var(--green)':'var(--red)'};">= Profit</div>
          <div class="track"><div class="fill" style="width:${Math.abs(profitPct)}%;background:linear-gradient(90deg,#059669,#10b981);"></div></div>
          <div class="val" style="color:${totalProf>=0?'var(--green)':'var(--red)'};">${fmtKipShort(totalProf)}</div>
        </div>
      </div>
    </div>

    ${cumMonths.length > 0 ? `<div class="chart-box" style="margin-bottom:18px;">
      <h3>${curYear} Cumulative Performance</h3>
      <p>Year-to-date revenue &amp; profit, accumulated month over month</p>
      <div class="chart-canvas-wrap" style="height:300px;"><canvas id="cum-chart"></canvas></div>
    </div>` : ''}

    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Monthly Breakdown</div><div class="panel-sub">${monthRows.length} months · Done jobs only · revenue, cost, profit, customers &amp; vs-prev delta</div></div></div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr>
          <th>Month</th>
          <th class="hide-mobile">Jobs</th>
          <th class="hide-mobile">Customers</th>
          <th>Revenue</th>
          <th class="hide-mobile">Cost</th>
          <th>Profit</th>
          <th class="hide-mobile">Margin</th>
          <th class="hide-mobile">Avg Deal</th>
          <th class="hide-mobile">vs prev</th>
          <th class="hide-mobile">Top customer</th>
        </tr></thead>
        <tbody>${monthRows.map(r => {
          const dArrow = r.deltaProfit === null ? '—' : (r.deltaProfit >= 0 ? '▲' : '▼');
          const dCol = r.deltaProfit === null ? 'var(--text-3)' : (r.deltaProfit >= 0 ? 'var(--green)' : 'var(--red)');
          const dTxt = r.deltaProfit === null ? '—' : `${dArrow} ${Math.abs(r.deltaProfit).toFixed(0)}%`;
          return `<tr>
            <td><strong>${r.month}</strong></td>
            <td class="hide-mobile">${r.count} <span style="color:var(--text-3);font-size:11px;">(${r.profitable}🟢 ${r.losing}🔴)</span></td>
            <td class="hide-mobile">${r.customers}</td>
            <td><strong>${fmtKipShort(r.revenue)}</strong></td>
            <td class="hide-mobile" style="color:var(--text-2);">${fmtKipShort(r.cost)}</td>
            <td style="color:${r.profit>=0?'var(--green)':'var(--red)'};font-weight:600;">${fmtKipShort(r.profit)}</td>
            <td class="hide-mobile">${r.margin.toFixed(1)}%</td>
            <td class="hide-mobile" style="color:var(--text-2);">${fmtKipShort(r.avg)}</td>
            <td class="hide-mobile" style="color:${dCol};font-weight:600;">${dTxt}</td>
            <td class="hide-mobile" style="font-size:11.5px;color:var(--text-2);">${r.topCust} <span style="color:var(--text-3);">(${fmtKipShort(r.topCustRev)})</span></td>

      </table></div></div>
    </div>

    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Line Items</div><div class="panel-sub">Every completed job · click to edit in Product Price</div></div></div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th><th>Customer / Project</th><th class="hide-mobile">Units</th><th>Revenue</th><th>Profit</th></tr></thead>
        <tbody>${lineItems.map(r => `<tr style="cursor:pointer" onclick="openPriceModal('${r.id}')">
          <td>${fmtDateShort(r.date)}</td>
          <td><div class="cust-cell"><div class="thumb">${initials(r.project||r.customer)}</div><div><div class="cust-name">${r.project||'—'}</div><div class="cust-proj">${r.customer||'—'}</div></div></div></td>
          <td class="hide-mobile">${fmtNum(r.unit)}</td>
          <td><strong>${fmtKipShort(r.revenue)}</strong></td>

  if (cumMonths.length > 0) drawCumulativeChart('cum-chart', cumMonths);
