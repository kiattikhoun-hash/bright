let tasksFilter = "All", tasksPicFilter = "All";
function renderTasks() {
  // Tasks marked Invoice have been transferred to Product Price — hide them here.
  const visibleTasks = TASKS.filter(t => t.status !== 'Invoice' && t.status !== 'Invoices');
  const sCounts = { All: visibleTasks.length };
  STATUSES_TASK.forEach(s => sCounts[s] = visibleTasks.filter(t => t.status === s).length);
  let filtered = visibleTasks.slice();
  if (tasksFilter!=="All") filtered = filtered.filter(t => t.status === tasksFilter);
  if (tasksPicFilter==='__unassigned') filtered = filtered.filter(t => !t.pic);
  else if (tasksPicFilter!=="All") filtered = filtered.filter(t => t.pic === tasksPicFilter);
  filtered.sort((a,b) => {
    const ca = (a.customer||'').toLowerCase(), cb = (b.customer||'').toLowerCase();
    if (ca !== cb) return ca.localeCompare(cb);
    return new Date(b.date||0) - new Date(a.date||0);
  });

  // Status chips exclude Invoice (those tasks live in Product Price now)
  const chipStatuses = STATUSES_TASK.filter(s => s !== 'Invoice' && s !== 'Invoices');

  // PIC chip counts respect the active status filter — so each chip shows what you'd
  // see after clicking it. Tasks without a PIC are bucketed under "Unassigned".
  const picScope = tasksFilter === 'All' ? visibleTasks : visibleTasks.filter(t => t.status === tasksFilter);
  const picCounts = {};
  TEAM.forEach(p => picCounts[p] = picScope.filter(t => t.pic === p).length);
  const unassignedCount = picScope.filter(t => !t.pic).length;

  document.getElementById('content').innerHTML = `
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Follow-up Tasks</div><div class="panel-sub">Grouped by customer · Invoice items moved to Product Price</div></div>
        <div class="filter-bar">
          <span class="chip ${tasksFilter==='All'?'active':''}" onclick="setTasksFilter('All')">All<span class="count">${sCounts.All}</span></span>
          ${chipStatuses.map(s => `<span class="chip ${tasksFilter===s?'active':''}" onclick="setTasksFilter('${s}')">${s}<span class="count">${sCounts[s]||0}</span></span>`).join('')}
        </div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--border-soft);background:#fafbfc;"><div class="panel-sub">PIC:</div>
        <div class="filter-bar">
          <span class="chip ${tasksPicFilter==='All'?'active':''}" onclick="setPicFilter('All')">All<span class="count">${picScope.length}</span></span>
          ${TEAM.map(t => `<span class="chip ${tasksPicFilter===t?'active':''}" onclick="setPicFilter('${t}')">${t}<span class="count">${picCounts[t]}</span></span>`).join('')}
          ${unassignedCount > 0 ? `<span class="chip ${tasksPicFilter==='__unassigned'?'active':''}" onclick="setPicFilter('__unassigned')" title="Tasks with no PIC assigned">Unassigned<span class="count">${unassignedCount}</span></span>` : ''}
        </div>
      </div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Project</th><th>PIC</th><th class="hide-mobile">Unit</th><th class="hide-mobile">¥/u</th><th class="hide-mobile">Sample¥</th><th>Status</th><th>Date</th><th class="hide-mobile">Files</th></tr></thead>
        <tbody>
          ${(() => {
            if (!filtered.length) return '<tr><td colspan="8" class="empty">No tasks match</td></tr>';
            // Group by customer (filtered is already sorted: customer asc, then date desc within group)
            const groups = {};
            const order = [];
            filtered.forEach(t => {
              const k = t.customer || '—';
              if (!(k in groups)) { groups[k] = []; order.push(k); }
              groups[k].push(t);
            });
            const sigDot = ok => `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${ok?'var(--green)':'var(--border)'};margin-right:3px;"></span>`;
            return order.map(cust => {
              const tasks = groups[cust];
              const header = `<tr class="cust-header"><td colspan="8" style="background:var(--accent-soft);padding:8px 14px;">
                <div style="display:flex;align-items:center;gap:10px;">
                  <div class="thumb" style="width:28px;height:28px;font-size:11px;border-radius:6px;">${initials(cust)}</div>
                  <strong style="font-size:13px;color:var(--accent);">${cust}</strong>
                  <span style="font-size:11.5px;color:var(--text-3);font-weight:500;">${tasks.length} item${tasks.length>1?'s':''}</span>
                </div></td></tr>`;
              const rows = tasks.map(t => {
                const dl = daysUntil(t.deadline||t.dueDate);
                const dlCls = dl===null?'':dl<0?'days-late':dl<=7?'days-warn':'days-ok';
                const dlTxt = dl===null?'':dl<0?`${Math.abs(dl)}d late`:`${dl}d`;
                return `<tr style="cursor:pointer" onclick="openTaskModal('${t.id}')">
                  <td><div class="cust-cell">${t.photoData?`<img src="${t.photoData}" class="task-photo" onclick="event.stopPropagation();showPhotoView('${t.id}')">`:`<div class="thumb">${initials(t.project)}</div>`}<div><div class="cust-name">${t.project||'—'}</div><div class="cust-proj">${t.description||''}</div></div></div></td>
                  <td>${t.pic||'—'}</td><td class="hide-mobile">${fmtNum(t.unit)}</td>
                  <td class="hide-mobile">${t.price?'¥'+t.price:'—'}</td><td class="hide-mobile">${t.sample?'¥'+fmtNum(t.sample):'—'}</td>
                  <td><span class="badge ${STATUS_BADGE[t.status]||''}">${t.status||'—'}</span></td>
                  <td><div class="deadline-cell"><span>${fmtDateShort(t.dueDate)}</span>${dlTxt?`<span class="days ${dlCls}">${dlTxt}</span>`:''}</div></td>
                  <td class="hide-mobile" style="font-size:11px;color:var(--text-2);">${t.hasPhoto?'📷':''}${t.hasCPForm?'📄':''} ${sigDot(t.picSign)}P${sigDot(t.approveSign)}A</td>
                </tr>`;
              }).join('');
              return header + rows;
            }).join('');
          })()}
        </tbody></table></div></div></div>`;
}
function setTasksFilter(f) { tasksFilter = f; render(); }
function setPicFilter(p) { tasksPicFilter = p; render(); }

// ─────────────────────────────────────── Follow-up Schedule (calendar template) ───
let schedPicFilter = 'All';
let schedMonth = null; // YYYY-MM, null = current month
let schedDay   = null; // YYYY-MM-DD, when set the schedule renders a single-day detail
function setSchedPic(p)   { schedPicFilter = p; render(); }
function setSchedMonth(m) { schedMonth = m; schedDay = null; render(); }
function setSchedDay(d)   { schedDay = d; render(); }

function renderSchedule() {
  const PRIORITY_META = {
    overdue:  { label:'Overdue',  color:'var(--red)',    bg:'#fee2e2' },
    critical: { label:'Critical', color:'#b54708',       bg:'#fef3c7' },
    high:     { label:'High',     color:'var(--amber)',  bg:'#fef3c7' },
    soon:     { label:'Soon',     color:'var(--blue)',   bg:'var(--blue-soft)' },
    later:    { label:'Later',    color:'var(--green)',  bg:'var(--green-soft)' },
    noDate:   { label:'No date',  color:'var(--text-3)', bg:'var(--gray-soft)' }
  };
  function urgencyDays(t) { const d = t.deadline || t.dueDate; return d ? daysUntil(d) : null; }
  function bucketOf(t) {
    const d = urgencyDays(t);
    if (d === null) return 'noDate';
    if (d < 0)  return 'overdue';
    if (d <= 3) return 'critical';
    if (d <= 7) return 'high';
    if (d <= 14) return 'soon';
    return 'later';
  }

  // Pool = active tasks (exclude Done / Invoice) optionally filtered by PIC
  const active = TASKS.filter(t => t.status !== 'Done' && t.status !== 'Invoice' && t.status !== 'Invoices');
  let pool = active;
  if (schedPicFilter !== 'All') pool = pool.filter(t => t.pic === schedPicFilter);

  // Priority counts for KPI strip (derived from pool)
  const buckets = { overdue:[], critical:[], high:[], soon:[], later:[], noDate:[] };
  pool.forEach(t => buckets[bucketOf(t)].push(t));
  const kpis = ['overdue','critical','high','soon','later','noDate'].map(k => {
    const m = PRIORITY_META[k];
    return `<div class="kpi" style="border-left:3px solid ${m.color};">
      <div class="kpi-label" style="color:${m.color};">${m.label}</div>
      <div class="kpi-value">${buckets[k].length}</div>
    </div>`;
  }).join('');

  // ── DAY VIEW BRANCH ─────────────────────────────────
  // When a calendar cell is clicked we render a focused single-day detail panel.
  if (schedDay) {
    const day = schedDay;
    const dayTasks = pool
      .filter(t => t.deadline === day || t.dueDate === day || t.date === day)
      .map(t => ({
        task: t,
        reasons: [
          t.deadline === day ? 'deadline' : null,
          t.dueDate  === day ? 'due'      : null,
          t.date     === day ? 'starting' : null
        ].filter(Boolean)
      }));
    const reasonOrder = { deadline: 0, due: 1, starting: 2 };
    dayTasks.sort((a, b) => reasonOrder[a.reasons[0]] - reasonOrder[b.reasons[0]]);

    const REASON_META = {
      deadline: { text: 'DEADLINE', color: 'var(--red)',   bg: '#fee2e2' },
      due:      { text: 'DUE',      color: 'var(--blue)',  bg: 'var(--blue-soft)' },
      starting: { text: 'STARTING', color: 'var(--green)', bg: 'var(--green-soft)' }
    };
    const dayLabel = parseLocalDate(day).toLocaleDateString('en-US',
      { weekday:'long', month:'long', day:'numeric', year:'numeric' });
    const monthOfDay = day.slice(0,7);
    const monthOfDayLabel = parseLocalDate(day).toLocaleDateString('en-US', { month:'long', year:'numeric' });

    const cardsHtml = dayTasks.map(({ task: t, reasons }) => {
      const meta = PRIORITY_META[bucketOf(t)];
      const ud = urgencyDays(t);
      const udTxt = ud === null ? '—' : (ud < 0 ? `${Math.abs(ud)}d late` : ud === 0 ? 'today' : `${ud}d left`);
      return `<div onclick="openTaskModal('${t.id}')" style="cursor:pointer;border-left:4px solid ${meta.color};background:var(--bg);border-radius:9px;padding:12px 14px;display:flex;align-items:flex-start;gap:14px;">
        <div class="thumb">${initials(t.project)}</div>
        <div style="flex:1;min-width:0;">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <strong style="font-size:14px;">${t.project || '—'}</strong>
            <span style="color:var(--text-3);font-size:12.5px;">${t.customer || ''}</span>
            ${reasons.map(r => `<span class="badge" style="background:${REASON_META[r].bg};color:${REASON_META[r].color};">${REASON_META[r].text}</span>`).join('')}
            <span class="badge ${STATUS_BADGE[t.status]||''}">${t.status||'—'}</span>
          </div>
          ${t.description ? `<div style="font-size:12px;color:var(--text-3);margin-top:3px;">${t.description}</div>` : ''}
          <div style="font-size:11.5px;color:var(--text-2);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap;">
            <span>PIC: <strong>${t.pic||'—'}</strong></span>
            <span>Start: <strong>${fmtDateShort(t.date)}</strong></span>
            <span>Due: <strong>${fmtDateShort(t.dueDate)}</strong></span>
            <span>Deadline: <strong>${fmtDateShort(t.deadline)}</strong></span>
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0;">
          <div style="font-weight:700;color:${meta.color};font-size:13.5px;">${udTxt}</div>
          <div style="font-size:10.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-top:2px;">${meta.label}</div>
        </div>
      </div>`;
    }).join('');

    document.getElementById('content').innerHTML = `
      <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">${kpis}</div>

      <div class="panel">
        <div class="panel-head" style="gap:14px;">
          <button class="btn" onclick="setSchedMonth('${monthOfDay}')" title="Back to ${monthOfDayLabel}">← Back</button>
          <div style="flex:1;min-width:0;">
            <div class="panel-title">${dayLabel}</div>
            <div class="panel-sub">${dayTasks.length} task${dayTasks.length===1?'':'s'} on this date${schedPicFilter!=='All'?` · PIC: ${schedPicFilter}`:''}</div>
          </div>
        </div>
        <div class="panel-head" style="border-top:1px solid var(--border-soft);background:#fafbfc;"><div class="panel-sub">PIC:</div>
          <div class="filter-bar">
            <span class="chip ${schedPicFilter==='All'?'active':''}" onclick="setSchedPic('All')">All</span>
            ${TEAM.map(t => `<span class="chip ${schedPicFilter===t?'active':''}" onclick="setSchedPic('${t}')">${t}</span>`).join('')}
          </div>
        </div>
        <div class="panel-body" style="display:grid;gap:10px;">
          ${cardsHtml || '<div class="empty">No tasks scheduled on this day</div>'}
        </div>
      </div>`;
    return;
  }

  // Calendar month state — defaults to current month
  const ym = schedMonth || todayISO().slice(0,7);
  const [y, m] = ym.split('-').map(Number);
  const firstOfMonth = new Date(y, m-1, 1);
  const startWeekday = firstOfMonth.getDay(); // 0=Sun
  const monthLabel = firstOfMonth.toLocaleDateString('en-US', { month:'long', year:'numeric' });
  function shiftMonth(ym, delta) {
    let [yy, mm] = ym.split('-').map(Number);
    mm += delta;
    if (mm < 1)  { mm = 12; yy--; }
    if (mm > 12) { mm = 1;  yy++; }
    return `${yy}-${String(mm).padStart(2,'0')}`;
  }

  // Place each task on EVERY date it has — deadline cell shows "DL", due-date cell shows "DUE".
  // When the two are the same day, show one "DL" pill (deadline wins). Tasks without any
  // date go to the "no date" footer.
  const tasksByDate = {};
  const undated = [];
  pool.forEach(t => {
    let placed = false;
    if (t.deadline) {
      (tasksByDate[t.deadline] = tasksByDate[t.deadline] || []).push({ t, kind: 'DL' });
      placed = true;
    }
    if (t.dueDate && t.dueDate !== t.deadline) {
      (tasksByDate[t.dueDate] = tasksByDate[t.dueDate] || []).push({ t, kind: 'DUE' });
      placed = true;
    }
    if (!placed) undated.push(t);
  });

  // Build 6×7 = 42 cells starting from the Sunday on/before the 1st
  const cellStart = new Date(y, m-1, 1 - startWeekday);
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(cellStart); d.setDate(d.getDate() + i);
    const iso = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    cells.push({
      iso,
      day: d.getDate(),
      inMonth: d.getMonth() === m-1,
      isToday: iso === todayISO(),
      isWeekend: d.getDay() === 0 || d.getDay() === 6
    });
  }

  function taskPill(t, kind) {
    const meta = PRIORITY_META[bucketOf(t)];
    const label = (t.project || '—') + (t.customer ? ' · ' + t.customer : '');
    const kindLabel = kind === 'DL' ? 'Deadline' : 'Due date';
    return `<div class="cal-task" onclick="event.stopPropagation();openTaskModal('${t.id}')"
              style="background:${meta.bg};color:${meta.color};border-left:3px solid ${meta.color};"
              title="${(t.project||'—').replace(/"/g,'&quot;')} · ${(t.customer||'').replace(/"/g,'&quot;')} · ${kindLabel} · ${meta.label}">
      <span class="cal-task-kind">${kind}</span>${label.replace(/</g,'&lt;')}
    </div>`;
  }

  const calendarHtml = `
    <div class="cal-grid">
      ${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d => `<div class="cal-head">${d}</div>`).join('')}
      ${cells.map(c => {
        // Sort by urgency (overdue → critical → … → later); deadline pills before due pills on the same urgency.
        const ts = (tasksByDate[c.iso] || []).slice(0).sort((a,b) => {
          const ua = PRIORITY_META[bucketOf(a.t)].label;
          const ub = PRIORITY_META[bucketOf(b.t)].label;
          return ua.localeCompare(ub) || (a.kind === b.kind ? 0 : a.kind === 'DL' ? -1 : 1);
        });
        const visible = ts.slice(0, 4);
        const extra = ts.length - visible.length;
        return `<div class="cal-cell ${c.inMonth?'':'cal-out'} ${c.isToday?'cal-today':''} ${c.isWeekend?'cal-weekend':''}" onclick="setSchedDay('${c.iso}')" title="View ${c.iso}">
          <span class="cal-date">${c.day}</span>
          ${visible.map(({t, kind}) => taskPill(t, kind)).join('')}
          ${extra > 0 ? `<div class="cal-more" title="${ts.slice(4).map(({t}) => (t.project||'—')).join('\n')}">+ ${extra} more</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;

  // Undated tasks appear in a small list under the calendar
  const undatedHtml = undated.length ? `
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">No date set</div><div class="panel-sub">${undated.length} active task${undated.length>1?'s':''} without a due date or deadline</div></div></div>
      <div class="panel-body" style="display:flex;flex-wrap:wrap;gap:8px;">
        ${undated.map(t => `<div onclick="openTaskModal('${t.id}')" style="cursor:pointer;display:flex;align-items:center;gap:8px;padding:7px 11px;background:var(--gray-soft);border:1px solid var(--border);border-radius:9px;font-size:12.5px;">
          <strong>${t.project||'—'}</strong>
          <span style="color:var(--text-3);">${t.customer||''}</span>
          <span class="badge ${STATUS_BADGE[t.status]||''}">${t.status||'—'}</span>
        </div>`).join('')}
      </div>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    <div class="kpi-grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));">${kpis}</div>

    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">${monthLabel}</div><div class="panel-sub">Tasks placed on their <strong>deadline</strong> (DL) or <strong>due date</strong> (DUE) · click a cell to view that day</div></div>
        <div class="filter-bar" style="margin-left:auto;align-items:center;gap:10px;">
          <button class="btn" onclick="setSchedMonth('${shiftMonth(ym,-1)}')">◀</button>
          <button class="btn" onclick="setSchedMonth('${todayISO().slice(0,7)}')">Today</button>
          <button class="btn" onclick="setSchedMonth('${shiftMonth(ym,+1)}')">▶</button>
        </div>
      </div>
      <div class="panel-head" style="border-top:1px solid var(--border-soft);background:#fafbfc;"><div class="panel-sub">PIC:</div>
        <div class="filter-bar">
          <span class="chip ${schedPicFilter==='All'?'active':''}" onclick="setSchedPic('All')">All</span>
          ${TEAM.map(t => `<span class="chip ${schedPicFilter===t?'active':''}" onclick="setSchedPic('${t}')">${t}</span>`).join('')}
        </div>
      </div>
      <div class="panel-body">${calendarHtml}</div>
    </div>

    ${undatedHtml}`;
}

let pricesFilter = "All";
function renderPrices() {
  // "Done" entries are hidden from this view
  const visible = PRICES.filter(p => p.status !== "Done");
  const sCounts = { All: visible.length, Invoice: visible.filter(p => p.status==="Invoice").length };
  let filtered = visible.slice();
  if (pricesFilter==="Invoice") filtered = filtered.filter(p => p.status==="Invoice");
  filtered.sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
  const totals = filtered.reduce((acc,p)=>{const c=calcProfit(p);acc.rev+=c.totalRevenue;acc.prof+=c.totalProfit;return acc;},{rev:0,prof:0});
  const margin = totals.rev>0 ? (totals.prof/totals.rev*100) : 0;

  document.getElementById('content').innerHTML = `
    <div class="formula-box"><strong>Profit:</strong> <code>profit = ( sellPrice − ( production + sample/unit + logistic ) × rateYuan ) × unit</code><br><span style="font-size:11px;">Production &amp; Logistic in ¥/unit · Sample total ¥ · Sell Price in ₭/unit</span></div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Total Revenue</div><div class="kpi-value">${fmtKipShort(totals.rev)}</div></div>
      <div class="kpi"><div class="kpi-label">Total Profit</div><div class="kpi-value" style="color:${totals.prof>=0?'var(--green)':'var(--red)'}">${fmtKipShort(totals.prof)}</div></div>
      <div class="kpi"><div class="kpi-label">Margin</div><div class="kpi-value" style="color:${margin>=0?'var(--green)':'var(--red)'}">${margin.toFixed(1)}%</div></div>
      <div class="kpi"><div class="kpi-label">Entries</div><div class="kpi-value">${filtered.length}</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">Product Price Records</div><div class="panel-sub">Source: Product Price sheet · ${PRICES.length} entries</div></div>
        <div class="filter-bar"><span class="chip ${pricesFilter==='All'?'active':''}" onclick="setPricesFilter('All')">All<span class="count">${sCounts.All}</span></span><span class="chip ${pricesFilter==='Invoice'?'active':''}" onclick="setPricesFilter('Invoice')">Invoice<span class="count">${sCounts.Invoice}</span></span></div>
      </div>
      <div class="panel-body tight"><div class="tbl-wrap"><table class="tbl">
        <thead><tr><th>Date</th><th>Customer / Project</th><th class="hide-mobile">Unit</th><th class="hide-mobile">Prod¥</th><th class="hide-mobile">Sample¥</th><th class="hide-mobile">Logist¥</th><th class="hide-mobile">Rate</th><th>Sell ₭/u</th><th>Profit</th><th>Status</th></tr></thead>
        <tbody>${filtered.map(p => { const c=calcProfit(p); const sellSet = (p.sellPrice||0)>0; return `<tr style="cursor:pointer" onclick="openPriceModal('${p.id}')">
          <td>${fmtDateShort(p.date)}</td>
          <td><div class="cust-cell"><div class="thumb">${initials(p.project)}</div><div><div class="cust-name">${p.project}</div><div class="cust-proj">${p.customer}</div></div></div></td>
          <td class="hide-mobile">${fmtNum(p.unit)}</td><td class="hide-mobile">${p.production?'¥'+p.production:'—'}</td><td class="hide-mobile">${p.sample?'¥'+fmtNum(p.sample):'—'}</td><td class="hide-mobile">${p.logistic?'¥'+p.logistic:'—'}</td><td class="hide-mobile">${p.rateYuan||'—'}</td>
          <td><strong>${sellSet?fmtKip(p.sellPrice):'<span style="color:var(--amber);">—</span>'}</strong></td>
          <td style="color:${sellSet?(c.totalProfit>=0?'var(--green)':'var(--red)'):'var(--text-3)'};font-weight:700;">${sellSet?fmtKipShort(c.totalProfit):'—'}${sellSet?`<div style="font-size:10px;font-weight:500;color:var(--text-3);">${c.margin.toFixed(0)}%</div>`:''}</td>
          <td><span class="badge ${STATUS_BADGE[p.status]||''}">${p.status}</span></td></tr>`;}).join('') || '<tr><td colspan="10" class="empty">No records</td></tr>'}
        </tbody></table></div></div>
    </div>`;
}
function setPricesFilter(f) { pricesFilter = f; render(); }

function renderDelivery() {
  // Hide only when BOTH stages are shipped — GZ/Plane (combined) AND Lao = fully complete.
  const isFullyShipped = d =>
    (d.gzStatus === 'Shipped' || d.planeStatus === 'Shipped') &&
    d.laoStatus === 'Shipped';
  const active = DLV.filter(d => !isFullyShipped(d));
  const gzpCount = active.filter(d => d.gzStatus || d.planeStatus).length;
  const laoCount = active.filter(d => d.laoStatus).length;
  document.getElementById('content').innerHTML = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-label">Active Shipments</div><div class="kpi-value">${active.length}</div></div>
      <div class="kpi"><div class="kpi-label">GZ / Plane</div><div class="kpi-value">${gzpCount}</div></div>
      <div class="kpi"><div class="kpi-label">In Lao</div><div class="kpi-value">${laoCount}</div></div>
      <div class="kpi"><div class="kpi-label">Overdue</div><div class="kpi-value" style="color:var(--red);">${active.filter(d=>d.dueDate&&daysUntil(d.dueDate)<0).length}</div></div>
    </div>
    <div class="panel"><div class="panel-head"><div><div class="panel-title">Active Shipments</div><div class="panel-sub">GZ/Plane → Lao tracking pipeline · Shipped items hidden</div></div></div></div>
    ${active.map(d => {
      const days = daysUntil(d.dueDate);
      const gzpStatus = d.gzStatus || d.planeStatus || '';
      const gzpTime   = d.gzTime   || d.planeTime   || '';
      const stages = [
        { label:'GZ/Plane', status:gzpStatus, time:gzpTime },
        { label:'Lao',      status:d.laoStatus, time:d.laoTime }
      ];
      // Color each stage by its actual status: Shipped→green, Delivery→amber, empty→grey
      stages.forEach(s => {
        s.cls = s.status === 'Shipped' ? 'done'
              : s.status === 'Delivery' ? 'active'
              : '';
      });
      return `<div class="delivery-card" onclick="openDeliveryModal('${d.tracking}')" style="cursor:pointer;">
        <div class="delivery-head"><div><div class="delivery-track">${d.tracking}</div><div class="delivery-name">${d.product}</div></div>
          <div style="text-align:right;"><div style="font-size:11px;color:var(--text-3);">Due ${fmtDateShort(d.dueDate)}${days!==null?` · <span class="days ${days<0?'days-late':days<=3?'days-warn':'days-ok'}">${days<0?Math.abs(days)+'d late':days+'d left'}</span>`:''}</div></div>
        </div>
        <div class="stage-track">${stages.map(s => {
          const statusColor = s.status==='Shipped' ? 'color:var(--green);font-weight:600;'
                            : s.status==='Delivery' ? 'color:var(--amber);font-weight:600;'
                            : 'color:var(--text-3);';
          return `<div class="stage ${s.cls}"><div class="stage-dot">${s.cls==='done'?'✓':''}</div><div class="stage-label">${s.label}</div><div class="stage-time" style="${statusColor}">${s.status||'—'}</div><div class="stage-time">${s.time?fmtDateShort(s.time):''}</div></div>`;
        }).join('')}</div>
      </div>`;
    }).join('') || '<div class="panel"><div class="panel-body empty">No active shipments</div></div>'}`;
}

function renderCustomers() {
  const stats = CUSTOMERS.map(c => {
    const tasks = TASKS.filter(t => t.customer===c);
    const rev = PRICES.filter(p => p.customer===c).reduce((s,p)=>s+calcProfit(p).totalRevenue,0);
    const prof = PRICES.filter(p => p.customer===c).reduce((s,p)=>s+calcProfit(p).totalProfit,0);
    return { name:c, tasks:tasks.length, active:tasks.filter(x=>x.status!=='Done').length, rev, prof };
  }).sort((a,b)=>b.rev-a.rev);
  document.getElementById('content').innerHTML = `<div class="panel"><div class="panel-head"><div class="panel-title">Customers</div><div class="panel-sub">${CUSTOMERS.length} accounts</div></div><div class="panel-body tight"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Tasks</th><th>Active</th><th>Revenue</th><th>Profit</th></tr></thead><tbody>${stats.map(s => `<tr><td><div class="cust-cell"><div class="thumb">${initials(s.name)}</div><div class="cust-name">${s.name}</div></div></td><td>${s.tasks}</td><td>${s.active}</td><td><strong>${fmtKipShort(s.rev)}</strong></td><td style="color:${s.prof>=0?'var(--green)':'var(--red)'};font-weight:600;">${fmtKipShort(s.prof)}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

function renderTeam() {
  const stats = TEAM.map(p => { const tasks = TASKS.filter(t => t.pic===p); return { name:p, tasks:tasks.length, open:tasks.filter(t=>t.status!=='Done').length, done:tasks.filter(t=>t.status==='Done').length }; });
  document.getElementById('content').innerHTML = `<div class="panel"><div class="panel-head"><div class="panel-title">Team</div><div class="panel-sub">${TEAM.length} PIC members</div></div><div class="panel-body tight"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Open</th><th>Done</th><th>Total</th></tr></thead><tbody>${stats.map(s=>`<tr><td><div class="cust-cell"><div class="thumb" style="background:linear-gradient(135deg,#fce7f3,#ede9fe);color:var(--purple);">${initials(s.name)}</div><div class="cust-name">${s.name}</div></div></td><td>${s.open}</td><td>${s.done}</td><td>${s.tasks}</td></tr>`).join('')}</tbody></table></div></div></div>`;
}

function quotationFileCount() {
  return QUOTATION_FILES.reduce((n, c) => {
    let count = (c.files || []).length;
    (c.projects || []).forEach(p => { count += (p.files || []).length; });
    return n + count;
  }, 0);
}

// Talk to the local bridge. Returns null + sets qtBridgeOk=false on connection failure.
async function qtFetch(path, opts = {}) {
  try {
    const r = await fetch(QT_BRIDGE + path, opts);
    qtBridgeOk = true;
    if (!r.ok) throw new Error(await r.text());
    const ct = r.headers.get('content-type') || '';
    return ct.includes('json') ? r.json() : r.text();
  } catch (e) {
    qtBridgeOk = false;
    return null;
  }
}

async function qtRefreshFiles() {
  const data = await qtFetch('/api/list');
  QUOTATION_FILES = data?.customers || [];
  return data;
}

// Find the saved PDF for a given record + doc type in the QUOTATION_FILES tree.
// Returns null if the bridge hasn't surfaced it yet (e.g. it was deleted on
// disk or sync hasn't run). Match is by `<docNo>_<DocTypeNoSpaces>_…` so the
// date suffix doesn't matter if the user changed q.date after generating.
function qtFindPdf(q, docType) {
  const safeCust = qtSafeFolder(q.customer);
  const safeProj = qtSafeFolder(q.project || 'Untitled Project');
  const cust = QUOTATION_FILES.find(c => c.name === safeCust);
  if (!cust) return null;
  const proj = (cust.projects || []).find(p => p.name === safeProj);
  if (!proj) return null;
  const docNo = (q.docNos && q.docNos[docType]) || q.docNo || '';
  const prefix = docNo + '_' + docType.replace(/\s+/g,'') + '_';
  return (proj.files || []).find(f => f.name.startsWith(prefix)) || null;
}
// Build the same path qtGeneratePdf would write to. Used as a fallback when
// QUOTATION_FILES hasn't been populated yet but we know the file exists.
function qtBuildPath(q, docType) {
  const safeCust = qtSafeFolder(q.customer);
  const safeProj = qtSafeFolder(q.project || 'Untitled Project');
  const safeDoc = docType.replace(/\s+/g,'');
  const docNo = (q.docNos && q.docNos[docType]) || q.docNo || '';
  const filename = `${docNo}_${safeDoc}_${q.date || todayISO()}.pdf`;
  return `${safeCust}/${safeProj}/${filename}`;
}
// Preview a record's generated PDF by record id + doc type. Resolves the path
// via QUOTATION_FILES first, falling back to a constructed path if the listing
// is stale. Called from the records-table badge onclick.
function qtPreviewByDoc(qId, docType) {
  const q = QUOTATIONS.find(x => x.id === qId);
  if (!q) { showToast('Record not found'); return; }
  const f = qtFindPdf(q, docType);
  const path = f ? f.path : qtBuildPath(q, docType);
  const name = f ? f.name : path.split('/').pop();
  qtShowInPanel(path, name);
}
// Open the edit form on a record with a specific doc type pre-selected. Used
// by the gray "not generated yet" timeline badges so the user can jump
// straight into the right step.
function qtOpenAtDocType(qId, docType) {
  const idx = QUOTATIONS.findIndex(x => x.id === qId);
  if (idx < 0) { showToast('Record not found'); return; }
  // Persist the desired starting doc type so the form opens already on it
  QUOTATIONS[idx].docType = docType;
  // Reset T&C to the new type's defaults so the dropdown reflects the switch
  QUOTATIONS[idx].terms = (QT_TERMS[docType] || []).map(t => ({ text: t, checked: true }));
  qtPersistRecords();
  openQuotationModal(qId);
}

function renderQuotations() {
  // Group records by customer for the "records" header line
  const byCust = {};
  QUOTATIONS.forEach(q => { (byCust[q.customer || 'Unassigned'] = byCust[q.customer || 'Unassigned'] || []).push(q); });

  // Always render the full Quotation → Invoice → Delivery Note → Receipt
  // timeline so the row makes the workflow state obvious. Generated docs are
  // bright/clickable-to-preview; not-yet-generated docs are gray/clickable-
  // to-open-the-form-on-that-type so the user can produce the missing PDF.
  // Short labels keep the column compact: Quote · Inv · DN · Rcpt.
  const SHORT = { 'Quotation':'Quote', 'Invoice':'Inv', 'Delivery Note':'DN', 'Receipt':'Rcpt' };
  const renderBadges = q => {
    const generated = new Set(q.generated || []);
    return QT_DOC_TYPES.map(g => {
      const short = SHORT[g] || g;
      if (generated.has(g)) {
        const f = qtFindPdf(q, g);
        const activePath = f ? f.path : qtBuildPath(q, g);
        const isActive = qtSelectedFile && qtSelectedFile.path === activePath;
        const tip = f ? `Click to preview ${f.name}` : 'Click to preview (file may still be syncing)';
        return `<span class="badge" onclick="event.stopPropagation();qtPreviewByDoc('${q.id}','${g}')" title="${tip}" style="background:${isActive?'var(--accent)':'var(--accent-soft)'};color:${isActive?'#fff':'var(--accent)'};font-size:10px;cursor:pointer;user-select:none;">👁 ${short}</span>`;
      }
      return `<span class="badge" onclick="event.stopPropagation();qtOpenAtDocType('${q.id}','${g}')" title="Not generated yet — click to open the form on ${g}" style="background:var(--gray-soft);color:var(--text-3);font-size:10px;cursor:pointer;user-select:none;opacity:.85;">${short}</span>`;
    }).join(' ');
  };

  // Filter chips: "All / Quotation / Invoice / Delivery Note / Receipt".
  // Filtering by a doc type only keeps records that have generated that type.
  // Counts shown on each chip make it easy to see workflow distribution.
  const docTypeCounts = {
    all: QUOTATIONS.length,
    Quotation: QUOTATIONS.filter(q => (q.generated||[]).includes('Quotation')).length,
    Invoice: QUOTATIONS.filter(q => (q.generated||[]).includes('Invoice')).length,
    'Delivery Note': QUOTATIONS.filter(q => (q.generated||[]).includes('Delivery Note')).length,
    Receipt: QUOTATIONS.filter(q => (q.generated||[]).includes('Receipt')).length,
  };
  const SHORT_FILTER = { 'Quotation':'Quote', 'Invoice':'Invoice', 'Delivery Note':'Delivery', 'Receipt':'Receipt' };
  const chip = (label, val, count) => {
    const isActive = (qtFilterDocType || null) === val;
    return `<span class="chip ${isActive?'active':''}" onclick="qtSetFilter(${val===null?'null':`'${val}'`})" style="cursor:pointer;">${label} <span style="opacity:.6;font-weight:400;">·&nbsp;${count}</span></span>`;
  };
  const filterChips = `
    <div style="display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 10px;">
      ${chip('All', null, docTypeCounts.all)}
      ${QT_DOC_TYPES.map(t => chip(SHORT_FILTER[t]||t, t, docTypeCounts[t])).join('')}
    </div>`;

  const filtered = qtFilterDocType
    ? QUOTATIONS.filter(q => (q.generated||[]).includes(qtFilterDocType))
    : QUOTATIONS.slice();
  const recordRows = filtered.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0)).map(q => `
    <tr onclick="openQuotationModal('${q.id}')" style="cursor:pointer;">
      <td><strong>${(q.docNos && q.docNos[q.docType]) || q.docNo || '—'}</strong></td>
      <td>${q.customer || '—'}</td>
      <td>${q.project || '—'}</td>
      <td>${q.date || '—'}</td>
      <td style="text-align:right;">${qtFmtAmount(qtTotals(q).grand, q.currency)}</td>
      <td>${renderBadges(q)}</td>
      <td style="text-align:center;width:42px;">
        <button onclick="event.stopPropagation();qtDeleteRecord('${q.id}')" title="Delete record"
          style="background:transparent;border:0;color:var(--red);cursor:pointer;font-size:18px;line-height:1;padding:4px 8px;border-radius:6px;">🗑</button>
      </td>
    </tr>
  `).join('');

  const bridgeStatus = qtBridgeOk
    ? '<span class="qt-bridge-status ok">● Bridge connected</span>'
    : '<span class="qt-bridge-status err">● Bridge offline</span>';

  const displayPanel = qtSelectedFile ? `
    <div class="panel" style="margin-bottom:14px;">
      <div class="panel-head">
        <div><div class="panel-title">Preview</div><div class="panel-sub">${qtSelectedFile.name || qtSelectedFile.path}</div></div>
        <div class="filter-bar">
          <button class="btn btn-primary" onclick="qtPrintCurrentPreview()">🖨 Print</button>
          <a class="btn" target="_blank" rel="noopener" href="${QT_BRIDGE}/api/file?path=${encodeURIComponent(qtSelectedFile.path)}">Open in new tab ↗</a>
          <button class="btn" onclick="qtClosePreview()">Close</button>
        </div>
      </div>
      <div class="panel-body" style="background:#f1f5f9;padding:14px;">
        <div id="qt-pdf-host"><div style="text-align:center;color:#94a3b8;padding:30px;">Rendering PDF…</div></div>
      </div>
    </div>` : '';

  document.getElementById('content').innerHTML = `
    ${displayPanel}
    <div class="panel">
      <div class="panel-head">
        <div><div class="panel-title">Records</div><div class="panel-sub">${QUOTATIONS.length} quotation${QUOTATIONS.length===1?'':'s'} · click a row to edit · click a status badge to preview the PDF above &nbsp;${bridgeStatus}</div></div>
        <div class="filter-bar">
          <button class="btn" onclick="qtReloadFiles()">↻ Refresh files</button>
        </div>

        <thead><tr><th>Doc No.</th><th>Customer</th><th>Project</th><th>Date</th><th style="text-align:right;">Grand Total</th><th>Generated</th><th></th></tr></thead>
        <tbody>${recordRows || `<tr><td colspan="7" class="empty">${qtFilterDocType ? `No records with a generated ${qtFilterDocType} yet.` : 'No quotations yet — click "+ New Quotation" to create one.'}</td></tr>`}</tbody>
      </table></div></div>
    </div>
  `;

  if (qtSelectedFile) qtRenderPdf();
}

// Pop the saved PDF up in the global modal — used when the user clicks a
// status badge in the records table. Reuses the same modal-bg/body container
// the quotation form lives in.
async function qtOpenPdfModal(path, name) {
  const url = QT_BRIDGE + '/api/file?path=' + encodeURIComponent(path);
  document.getElementById('modal-title').textContent = name;
  document.getElementById('modal-body').innerHTML =
    `<div id="qt-modal-pdf" style="background:#f1f5f9;padding:14px;border-radius:8px;max-height:75vh;overflow:auto;">
       <div style="text-align:center;color:#94a3b8;padding:30px;">Rendering PDF…</div>
     </div>`;
  document.getElementById('modal-foot').innerHTML =
    `<a class="btn" target="_blank" rel="noopener" href="${url}">Open in new tab ↗</a>
     <div style="flex:1"></div>
     <button class="btn" onclick="closeModal()">Close</button>`;
  document.getElementById('modal-bg').classList.add('show');

  const host = document.getElementById('qt-modal-pdf');
  if (!window.pdfjsLib) {
    host.innerHTML = '<div style="text-align:center;color:#94a3b8;padding:30px;">PDF renderer not loaded — check internet.</div>';
    return;
  }
  try {
    const doc = await pdfjsLib.getDocument({ url }).promise;
    host.innerHTML = '';
    const RENDER_SCALE = 2;
    for (let i = 1; i <= doc.numPages; i++) {
      const page = await doc.getPage(i);
      const vp = page.getViewport({ scale: RENDER_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width = vp.width; canvas.height = vp.height;
      canvas.style.cssText = 'display:block;width:100%;height:auto;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.12);margin-bottom:10px;border-radius:4px;';
      host.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
    }
  } catch (e) {
    host.innerHTML = `<div style="text-align:center;color:#ef4444;padding:30px;">Failed to render: ${e.message}</div>`;
  }
}

// Render a PDF into the right pane via pdf.js. Each page is drawn to a canvas
// at a high INTERNAL resolution (sharp on retina) and then scaled down to the
// pane width via CSS `width:100%`. This sidesteps any pane-measurement bugs
// or browser PDF-viewer quirks — the canvas literally cannot overflow.
async function qtRenderPdf() {
  const host = document.getElementById('qt-pdf-host');
  if (!host || !qtSelectedFile) return;
  if (!window.pdfjsLib) { host.innerHTML = '<div class="qt-pdf-loading">PDF renderer not loaded — check internet.</div>'; return; }
  try {
    const url = QT_BRIDGE + '/api/file?path=' + encodeURIComponent(qtSelectedFile.path);
    const pdf = await pdfjsLib.getDocument({ url }).promise;
    host.innerHTML = '';
    const RENDER_SCALE = 2; // high-res bitmap; CSS scales display to 100% pane width
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: RENDER_SCALE });
      const canvas = document.createElement('canvas');
      canvas.width  = vp.width;
      canvas.height = vp.height;
      canvas.style.cssText = 'display:block;width:100%;max-width:900px;height:auto;background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.12);margin:0 auto 10px;border-radius:4px;';
      const ctx = canvas.getContext('2d');
      host.appendChild(canvas);
      await page.render({ canvasContext: ctx, viewport: vp }).promise;
    }
  } catch (e) {
    host.innerHTML = `<div style="text-align:center;color:#ef4444;padding:30px;">Failed to render: ${e.message}</div>`;
  }
}

// Open the current preview in a hidden iframe and trigger the browser's print
// dialog. Blob URLs are same-origin so iframe.contentWindow.print() works
// reliably across browsers — no pop-up blocker issue.
async function qtPrintCurrentPreview() {
  if (!qtSelectedFile) return;
  const url = QT_BRIDGE + '/api/file?path=' + encodeURIComponent(qtSelectedFile.path);
  showToast('Preparing print…');
  try {
    const blob = await (await fetch(url)).blob();
    const blobUrl = URL.createObjectURL(blob);
    const old = document.getElementById('qt-print-frame');
    if (old) old.remove();
    const iframe = document.createElement('iframe');
    iframe.id = 'qt-print-frame';
    iframe.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    iframe.src = blobUrl;
    iframe.onload = () => {
      try { iframe.contentWindow.focus(); iframe.contentWindow.print(); }
      catch (e) { window.open(blobUrl, '_blank'); }
    };
    document.body.appendChild(iframe);
  } catch (e) {
    showToast('Print failed: ' + e.message);
  }
}
async function qtLoadJsonPreview() {
  const el = document.getElementById('qt-json-view');
  if (!el || !qtSelectedFile) return;
  try {
    const r = await fetch(QT_BRIDGE + '/api/file?path=' + encodeURIComponent(qtSelectedFile.path));
    el.textContent = JSON.stringify(await r.json(), null, 2);
  } catch (e) { el.textContent = 'Error: ' + e.message; }
}
function qtToggleCollapse() { qtPaneCollapsed = !qtPaneCollapsed; render(); }

// Drag the resizer to change the file-list pane width. The new width persists
// in localStorage so a session-to-session resize feels stable.
function qtBindResizer() {
  const r = document.getElementById('qt-resizer');
  const left = document.getElementById('qt-pane-left');
  const split = document.getElementById('qt-split');
  if (!r || !left || !split) return;
  const saved = parseInt(localStorage.getItem('qt-pane-width') || '320', 10);
  if (!qtPaneCollapsed) left.style.flexBasis = saved + 'px';
  let dragging = false;
  r.addEventListener('mousedown', e => {
    if (qtPaneCollapsed) return;
    dragging = true; r.classList.add('dragging');
    document.body.style.userSelect = 'none'; document.body.style.cursor = 'col-resize';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const splitRect = split.getBoundingClientRect();
    const w = Math.max(140, Math.min(splitRect.width * 0.7, e.clientX - splitRect.left));
    left.style.flexBasis = w + 'px';
  });
  document.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false; r.classList.remove('dragging');
    document.body.style.userSelect = ''; document.body.style.cursor = '';
    localStorage.setItem('qt-pane-width', parseInt(left.style.flexBasis, 10) || 320);
  });
}

        ${QT_DOC_TYPES.map(d => `<span class="chip ${d===q.docType?'active':''}" onclick="qtPickDocType(this,'${d}')">${d}</span>`).join('')}

        <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border-soft);">

          <div style="display:flex;flex-wrap:wrap;gap:6px;">

    <div style="flex:1"></div>

  `;
  // Stash the working copy on the modal so add/remove/photo handlers can mutate it
  const m = document.getElementById('modal');

  document.getElementById('modal-bg').classList.add('show');
  setTimeout(() => {
    qtRenderLines();
    qtRefreshTotals();

    qtRenderSignature();
    setupAutocomplete(document.getElementById('q-cust'), () => CUSTOMERS);

}

// ── Signature: file upload → base64 → drawn above PREPARED BY in PDF ───────
// A "default" signature can be saved in localStorage so every new quotation
// auto-fills with it. Upload once, click ★ Save as default, and you're done.
const QT_DEFAULT_SIG_KEY = 'qt_default_signature_v1';
function qtGetDefaultSig() {
  try { return localStorage.getItem(QT_DEFAULT_SIG_KEY) || ''; } catch(e) { return ''; }
}
function qtSetDefaultSig(d) {
  try { localStorage.setItem(QT_DEFAULT_SIG_KEY, d); } catch(e) {}
}
function qtClearDefaultSig() {
  try { localStorage.removeItem(QT_DEFAULT_SIG_KEY); } catch(e) {}
}

function qtRenderSignature() {
  const host = document.getElementById('q-sig-host');
  if (!host) return;
  const q = qtCurrentRecord();

    host.innerHTML = `

        </div>
      </div>`;
  } else {

    // or the Bright logo as the brand-mark fallback.

        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">

            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn btn-sm" onclick="qtUseDefaultSignature()">Use as record signature</button>
              <button type="button" class="btn btn-sm" onclick="qtPickSignature()">Upload different</button>
              <button type="button" class="btn btn-sm" style="color:var(--red);border-color:var(--red);" onclick="qtBlankSignature()">🚫 Blank</button>
            </div>
            <button type="button" class="btn btn-sm" style="color:var(--red);border-color:var(--red);" onclick="qtClearDefaultSigUI()">Clear saved default</button>
            <span style="font-size:11.5px;color:var(--text-3);">★ Default signature · used on every Quotation unless replaced or blanked.</span>
          </div>
        </div>`;
    } else {
      const svg = document.getElementById('bright-logo-master');
      const logoMarkup = svg ? svg.outerHTML : '';
      host.innerHTML = `
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
          <div style="height:60px;width:120px;border:1px dashed var(--border);background:#0a2c65;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center;">
            <div style="width:100%;height:100%;">${logoMarkup}</div>
          </div>
          <div style="display:flex;flex-direction:column;gap:4px;">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="btn btn-sm" onclick="qtPickSignature()">📎 Upload signature</button>
              <button type="button" class="btn btn-sm" style="color:var(--red);border-color:var(--red);" onclick="qtBlankSignature()">🚫 Blank</button>
            </div>
            <span style="font-size:11.5px;color:var(--text-3);">No default set · Bright logo will be used. Upload once, then click ★ Save as default.</span>
          </div>
        </div>`;
      const dup = host.querySelector('#bright-logo-master');

// Mark this record as "no signature on the PDF" — overrides upload, default,
// and the logo fallback. Quotation PDF prints an empty signature box.
function qtBlankSignature() {
  const q = qtCurrentRecord();
  q.signature = '';
  q.signatureBlank = true;
  qtSetCurrentRecord(q);
  qtRenderSignature();
}
function qtUnblankSignature() {
  const q = qtCurrentRecord();
  q.signatureBlank = false;
  qtSetCurrentRecord(q);
  qtRenderSignature();
}
function qtSaveCurrentAsDefault() {
  const q = qtCurrentRecord();
  if (!q.signature) { showToast('Upload a signature first'); return; }
  qtSetDefaultSig(q.signature);

}
function qtUseDefaultSignature() {
  const saved = qtGetDefaultSig();

function qtClearDefaultSigUI() {

}
function qtPickSignature() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const q = qtCurrentRecord();

function qtClearSignature() {

  q.signature = '';

// Convert q.terms into the canonical [{text, checked}] shape, regardless of
// what was previously saved on the record:
//   • undefined  → all defaults, all checked
//   • [string]   → defaults checked iff present, plus user-added strings appended
//   • [{text,checked}] → kept as-is
function qtNormalizeTerms(termsRaw, docType) {
  const opts = QT_TERMS[docType] || [];
  if (Array.isArray(termsRaw) && termsRaw.length && typeof termsRaw[0] === 'object') {
    return termsRaw.map(t => ({ text: t.text || '', checked: !!t.checked }));
  }
  if (Array.isArray(termsRaw)) {
    const sel = new Set(termsRaw);
    const out = opts.map(t => ({ text: t, checked: sel.has(t) }));
    for (const t of termsRaw) if (!opts.includes(t)) out.push({ text: t, checked: true });
    return out;
  }
  return opts.map(t => ({ text: t, checked: true }));
}

// Render the Terms & Conditions multi-select dropdown using <details>.
// Each line is editable inline; users can add or remove lines freely.
// Selections live on the record as q.terms = [{ text, checked }, ...].
// Switching doc type via qtPickDocType resets to that doc type's defaults.
function qtRenderTerms() {
  const q = qtCurrentRecord();
  q.terms = qtNormalizeTerms(q.terms, q.docType);
  qtSetCurrentRecord(q);
  const host = document.getElementById('q-terms-host');
  if (!host) return;
  const esc = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const total = q.terms.length;
  const checkedCount = q.terms.filter(t => t.checked).length;
  host.innerHTML = `
    <details style="position:relative;">
      <summary style="cursor:pointer;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center;background:#fff;">
        <span id="q-terms-count">${checkedCount} of ${total} selected · click to edit</span>
        <span style="color:var(--text-3);">▾</span>
      </summary>
      <div style="margin-top:6px;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:#fff;max-height:300px;overflow:auto;">
        ${q.terms.map((t, i) => `
          <div style="display:flex;gap:8px;align-items:center;padding:3px 0;">
            <input type="checkbox" ${t.checked?'checked':''} onchange="qtToggleTermAt(${i},this.checked)" title="Include on PDF" style="width:16px;height:16px;flex:0 0 16px;margin:0;padding:0;border:1px solid var(--border);border-radius:0;" />
            <input type="text" value="${esc((t.text||'').replace(/^\*\s*/, ''))}" oninput="qtEditTermAt(${i}, this.value)" placeholder="Term or condition…" style="flex:1;min-width:0;width:auto;font-size:12.5px;padding:5px 7px;border:1px solid var(--border);border-radius:6px;" />
            <button type="button" onclick="qtDeleteTermAt(${i})" title="Remove this line" style="flex:0 0 auto;background:transparent;border:0;color:var(--red);cursor:pointer;font-size:18px;padding:0 6px;line-height:1;">×</button>
          </div>
        `).join('') || '<div style="font-size:12px;color:var(--text-3);padding:6px 0;">No terms — add one below.</div>'}
        <div style="display:flex;gap:6px;margin-top:8px;border-top:1px dashed var(--border-soft);padding-top:8px;">
          <button type="button" class="btn btn-sm" onclick="qtAddTerm()">+ Add line</button>
          <button type="button" class="btn btn-sm" onclick="qtResetTerms()" title="Reload the default ${q.docType} terms">↺ Reset to defaults</button>
        </div>
      </div>
    </details>`;
}

function qtUpdateTermsCount() {
  const q = qtCurrentRecord();
  const c = document.getElementById('q-terms-count');
  if (!c) return;
  const total = (q.terms||[]).length;
  const checked = (q.terms||[]).filter(t => t.checked).length;
  c.textContent = `${checked} of ${total} selected · click to edit`;
}
function qtToggleTermAt(i, checked) {
  const q = qtCurrentRecord();
  if (!q.terms || !q.terms[i]) return;
  q.terms[i].checked = !!checked;
  qtSetCurrentRecord(q);
  qtUpdateTermsCount();
}
function qtEditTermAt(i, text) {
  const q = qtCurrentRecord();
  if (!q.terms || !q.terms[i]) return;
  q.terms[i].text = text;
  qtSetCurrentRecord(q);
}
function qtDeleteTermAt(i) {
  const q = qtCurrentRecord();
  if (!q.terms) return;
  q.terms.splice(i, 1);
  qtSetCurrentRecord(q);
  qtRenderTerms();
}
function qtAddTerm() {
  const q = qtCurrentRecord();
  if (!Array.isArray(q.terms)) q.terms = [];
  q.terms.push({ text: '', checked: true });
  qtSetCurrentRecord(q);
  qtRenderTerms();
  // Focus the new input so the user can type immediately
  setTimeout(() => {
    const inputs = document.querySelectorAll('#q-terms-host input[type="text"]');
    const last = inputs[inputs.length - 1];
    if (last) last.focus();
  }, 0);
}
function qtResetTerms() {
  const q = qtCurrentRecord();
  q.terms = (QT_TERMS[q.docType] || []).map(t => ({ text: t, checked: true }));
  qtSetCurrentRecord(q);
  qtRenderTerms();
}

function qtCurrentRecord() {
  return JSON.parse(document.getElementById('modal').dataset.qtRecord);
}
function qtSetCurrentRecord(q) {
  document.getElementById('modal').dataset.qtRecord = JSON.stringify(q);
}

function qtPickDocType(el, d) {
  el.parentElement.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const q = qtCurrentRecord();
  // Persist any currently-typed doc number into the OUTGOING doc type before
  // switching, so the user's edit isn't lost.
  const docNoInput = document.getElementById('q-no');
  if (docNoInput && q.docType) {
    if (!q.docNos) q.docNos = {};
    q.docNos[q.docType] = docNoInput.value.trim();
  }
  q.docType = d;
  // Reset T&C selections to the new doc type's defaults
  q.terms = (QT_TERMS[d] || []).slice();
  // Show the doc number for the newly selected type (lazy-generate if missing)
  const newNo = qtDocNoFor(q, d);
  if (docNoInput) docNoInput.value = newNo;
  qtSetCurrentRecord(q);
  qtRenderTerms();
}
function qtUpdateDocNo(val) {
  const q = qtCurrentRecord();
  if (!q.docNos) q.docNos = {};
  q.docNos[q.docType] = val;
  qtSetCurrentRecord(q);
}
function qtBankPicked() {
  const sel = document.getElementById('q-bank');
  const acc = sel.options[sel.selectedIndex]?.dataset.acc || '';
  document.getElementById('q-acc').value = acc;
}
function qtAddLine() {
  const q = qtCurrentRecord(); q.items.push(blankLine()); qtSetCurrentRecord(q);
  qtRenderLines(); qtRefreshTotals();
}
function qtRemoveLine(i) {
  const q = qtCurrentRecord();
  if (q.items.length <= 1) { showToast('Need at least one line'); return; }
  q.items.splice(i, 1); qtSetCurrentRecord(q);
  qtRenderLines(); qtRefreshTotals();
}
function qtUpdateLine(i, field, val) {
  const q = qtCurrentRecord();
  q.items[i][field] = (field === 'qty' || field === 'unitPrice') ? (parseFloat(val) || 0) : val;
  qtSetCurrentRecord(q);
  if (field === 'qty' || field === 'unitPrice') qtRefreshTotals();
}
function qtPickLinePhoto(i) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const q = qtCurrentRecord();
      q.items[i].photoData = r.result;

  };
