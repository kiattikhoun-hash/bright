}
function qtRenderLines() {
  const q = qtCurrentRecord();
  document.getElementById('q-lines-body').innerHTML = q.items.map((it, i) => `
    <div class="qt-line-row">
      <div style="align-self:center;color:var(--text-3);font-weight:600;">${i+1}</div>
      <div class="qt-line-photo" onclick="qtPickLinePhoto(${i})" title="Click to ${it.photoData?'replace':'add'} photo">
        ${it.photoData ? `<img src="${it.photoData}">` : 'Click to<br>add photo'}
      </div>
      <textarea rows="1" oninput="qtUpdateLine(${i},'description',this.value);qtAutoGrow(this)" placeholder="Item description (size, material, color, finishing — multi-line OK)…">${(it.description||'').replace(/</g,'&lt;')}</textarea>
      <input type="number" step="any" value="${it.qty}" oninput="qtUpdateLine(${i},'qty',this.value)" />
      <input type="number" step="any" value="${it.unitPrice}" oninput="qtUpdateLine(${i},'unitPrice',this.value)" />
      <div class="qt-line-amt" id="q-amt-${i}">${qtFmtAmount((+it.qty||0)*(+it.unitPrice||0), q.currency)}</div>
      <input type="text" value="${(it.status||'').replace(/"/g,'&quot;')}" placeholder="e.g. Delivered" oninput="qtUpdateLine(${i},'status',this.value)" />
      <button class="qt-line-del" onclick="qtRemoveLine(${i})" title="Remove line">×</button>
    </div>
  `).join('');
  // Size each textarea to its actual content so the row hugs the description
  document.querySelectorAll('#q-lines-body textarea').forEach(qtAutoGrow);
}

// Make a textarea's height match its scrollHeight — fits the typed content
// exactly, no fixed min height to leave whitespace, no scrollbar to clip text.
function qtAutoGrow(el) {
  el.style.height = 'auto';
  el.style.height = el.scrollHeight + 'px';
}
function qtTotals(q) {
  const sub = q.items.reduce((n, it) => n + (+it.qty||0) * (+it.unitPrice||0), 0);
  const vat = sub * (+q.vatRate || 0) / 100;
  return { sub, vat, grand: sub + vat };
}
function qtRefreshTotals() {
  const q = qtCurrentRecord();
  q.vatRate = +document.getElementById('q-vat').value || 0;
  qtSetCurrentRecord(q);
  const t = qtTotals(q), curr = document.getElementById('q-curr').value;
  q.items.forEach((it, i) => {
    const el = document.getElementById('q-amt-' + i);
    if (el) el.textContent = qtFmtAmount((+it.qty||0)*(+it.unitPrice||0), curr);
  });
  document.getElementById('q-sub').textContent     = qtFmtAmount(t.sub, curr);
  document.getElementById('q-vat-amt').textContent = qtFmtAmount(t.vat, curr);
  document.getElementById('q-grand').textContent   = qtFmtAmount(t.grand, curr);
  document.getElementById('q-vat-pct').textContent = q.vatRate;
}
function qtFmtAmount(n, curr) {
  const v = (+n || 0).toLocaleString('en-US', { maximumFractionDigits: curr === 'LAK' ? 0 : 2 });
  return v + ' ' + (curr || '');
}
function qtFmtBytes(n) {
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  return (n/1048576).toFixed(1) + ' MB';
}

// Read all form values back into the working record before save / PDF
function qtReadFormIntoRecord() {
  const q = qtCurrentRecord();
  // Per-doc-type doc numbers — write the current input into q.docNos[q.docType]
  if (!q.docNos) q.docNos = {};
  q.docNos[q.docType] = document.getElementById('q-no').value.trim();
  delete q.docNo; // drop legacy single field once migrated
  q.project       = document.getElementById('q-proj').value.trim();
  q.customer      = document.getElementById('q-cust').value.trim();
  q.contactPerson = document.getElementById('q-contact').value.trim();
  q.address       = document.getElementById('q-addr').value.trim();
  q.officeNumber  = document.getElementById('q-office').value.trim();
  q.contactNumber = document.getElementById('q-phone').value.trim();
  q.email         = document.getElementById('q-email').value.trim();
  q.date          = document.getElementById('q-date').value;
  q.validUntil    = document.getElementById('q-valid').value;
  q.currency      = document.getElementById('q-curr').value;
  q.vatRate       = +document.getElementById('q-vat').value || 0;
  q.bankName      = document.getElementById('q-bank').value;
  q.accountNo     = document.getElementById('q-acc').value.trim();
  q.notes         = document.getElementById('q-notes').value;
  q.updatedAt     = Date.now();
  qtSetCurrentRecord(q);
  return q;
}

async function qtSaveRecord(id, isEdit, generatePdf) {
  const q = qtReadFormIntoRecord();
  if (!q.customer) { showToast('Customer is required'); return; }
  if (!q.docNos[q.docType]) { showToast('Doc No. is required'); return; }
  if (generatePdf && !q.project) { showToast('Project is required for the folder name'); return; }

  // Persist in-memory record (and to localStorage so it survives page reload — the
  // user asked us not to write JSON files into the Synology folder anymore).
  if (isEdit) {
    const idx = QUOTATIONS.findIndex(x => x.id === id);
    if (idx >= 0) QUOTATIONS[idx] = q;
  } else {
    QUOTATIONS.push(q);
  }
  qtPersistRecords();

  let pdfOk = !generatePdf; // success unless we tried to generate
  let savedPath = null;
  if (generatePdf) {
    try {
      savedPath = await qtGeneratePdf(q);
      pdfOk = !!savedPath;
    } catch (e) {
      pdfOk = false;
      console.error('[qt] generate failed', e);
      showToast('PDF generate failed: ' + (e.message || e));
    }
  }

  await qtRefreshFiles();
  // Auto-select the just-saved PDF so it appears in the preview pane immediately.
  if (savedPath) qtSelectedFile = { path: savedPath, type: 'pdf' };
  closeModal();
  if (generatePdf) {
    showToast(pdfOk ? `${q.docType} PDF saved to Synology Drive` : 'Record saved (PDF failed)');
  } else {
    showToast('Record saved');
  }
  if (currentView === 'quotations') render();
}

// Browser-only persistence — keeps the in-memory QUOTATIONS array across reloads
// without leaving JSON files on disk in the Synology folder.
const QT_LS_KEY = 'qt_records_v1';
function qtPersistRecords() {
  try { localStorage.setItem(QT_LS_KEY, JSON.stringify(QUOTATIONS)); } catch(e) {}
}
function qtLoadRecords() {
  try {
    const raw = localStorage.getItem(QT_LS_KEY);
    if (raw) QUOTATIONS = JSON.parse(raw) || [];
  } catch(e) {}
  // One-time migration: legacy account name → new official name
  let migrated = false;
  for (const q of QUOTATIONS) {
    if (q.accountName === 'Bright Production and Printing') {
      q.accountName = 'Bright Production and Printing Individual Enterprise';
      migrated = true;
    }
  }
  if (migrated) qtPersistRecords();
}

async function qtDeleteRecord(id) {
  if (!confirm('Delete this quotation record? PDFs already on disk are kept.')) return;
  QUOTATIONS = QUOTATIONS.filter(x => x.id !== id);
  qtPersistRecords();
  closeModal();
  if (currentView === 'quotations') render();
}

// Strip slashes/control chars so a customer name is safe as a folder name
function qtSafeFolder(s) { return (s || 'Unassigned').replace(/[\\/:*?"<>|\x00-\x1f]/g, '_').trim() || 'Unassigned'; }

// ── Doc-No. helpers ─────────────────────────────────────────────────────────
// Each doc type gets its own unique Doc No. so a single record can produce
// four distinct numbered PDFs. Numbers live on q.docNos (object keyed by
// doc type). Legacy records had a single q.docNo string — migrated lazily.
const QT_DOC_CODE = { 'Quotation':'Q', 'Invoice':'INV', 'Delivery Note':'DN', 'Receipt':'RCT' };
function qtNewDocNo(docType) {
  const code = QT_DOC_CODE[docType] || 'X';
  const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
  const n = Math.floor(Math.random() * 900 + 100);
  return `BR-${code}-${date}-${n}`;
}
function qtDocNoFor(q, docType) {
  if (!q.docNos) q.docNos = {};
  // Adopt legacy q.docNo into the map under the record's current doc type
  if (q.docNo && !q.docNos[q.docType || 'Quotation']) {
    q.docNos[q.docType || 'Quotation'] = q.docNo;
  }
  if (!q.docNos[docType]) q.docNos[docType] = qtNewDocNo(docType);
  return q.docNos[docType];
}

// Add `n` calendar days to a YYYY-MM-DD ISO string and return YYYY-MM-DD.
function qtAddDays(iso, n) {
  if (!iso) return '';
  const d = parseLocalDate(iso);
  d.setDate(d.getDate() + n);
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${dd}`;
}

// Auto-fill the Valid Until field as Date + 15 days when the user changes the
// Date input. Always overwrites to keep the +15 invariant — quotation T&C
// promises the doc is valid for 15 days from the issue date.
function qtAutoValid() {
  const dateEl = document.getElementById('q-date');
  const validEl = document.getElementById('q-valid');
  if (!dateEl || !validEl) return;
  const v = qtAddDays(dateEl.value, 15);
  if (v) validEl.value = v;
}

// Rasterize the inline #bright-logo-master SVG (in the page DOM) to a PNG
// dataURL at the requested mm size. Reading from the DOM avoids any external
// file-fetch quirks (file://, CORS, missing asset) — the logo always works.
let __qtLogoCache = null;
function qtLoadLogoPng(wMm, hMm) {
  if (__qtLogoCache && __qtLogoCache.w === wMm && __qtLogoCache.h === hMm) {
    return Promise.resolve(__qtLogoCache.dataUrl);
  }
  return new Promise((resolve, reject) => {
    const svgEl = document.getElementById('bright-logo-master');
    if (!svgEl) return reject(new Error('logo SVG not in DOM'));
    const xml = new XMLSerializer().serializeToString(svgEl);
    const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
    const img = new Image();
    img.onload = () => {
      try {
        const PX_PER_MM = 8;
        const canvas = document.createElement('canvas');
        canvas.width  = Math.round(wMm * PX_PER_MM);
        canvas.height = Math.round(hMm * PX_PER_MM);
        const ctx = canvas.getContext('2d');
        // Fill navy explicitly so the embedded raster has a solid navy bg
        // (avoids any chance of transparent pixels showing through).
        ctx.fillStyle = '#0a2c65';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataUrl = canvas.toDataURL('image/png');
        __qtLogoCache = { w: wMm, h: hMm, dataUrl };
        resolve(dataUrl);
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('failed to render logo SVG'));
    img.src = svgUrl;
  });
}

// ── PDF generator ──────────────────────────────────────────────────────────
// Renders a fresh HTML doc in a hidden container, runs html2pdf to produce a Blob,
// then ships the bytes to the bridge so it lands in the Synology Drive folder.
// Build the PDF directly with jsPDF primitives (rectangles + text + images).
// All coordinates are in millimetres on a real A4 page, so content physically
// cannot overflow the page width. Tables auto-paginate via the jspdf-autotable
// plugin. Replaces the previous html2canvas-based renderer entirely.
async function qtGeneratePdf(q) {
  const jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDF) { showToast('jsPDF not loaded — check internet'); return; }

  // ── A4 portrait page geometry (in mm) ────────────────────────────────────
  const PG_W = 210, PG_H = 297;
  const ML = 12, MR = 12, MT = 12, MB = 14;
  const CW = PG_W - ML - MR;          // content width = 186 mm
  const NAVY = [20, 42, 95];
  const AMBER = [245, 158, 11];
  const TEXT = [15, 23, 42];
  const MUTE = [148, 163, 184];
  const BG_SOFT = [248, 250, 252];

  const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });

  // helper — set font in one call
  const font = (size, weight = 'normal', color = TEXT) => {
    pdf.setFont('helvetica', weight);
    pdf.setFontSize(size);
    pdf.setTextColor(color[0], color[1], color[2]);
  };
  const fill = c => pdf.setFillColor(c[0], c[1], c[2]);
  const stroke = c => pdf.setDrawColor(c[0], c[1], c[2]);

  // dd-MMM-yy
  const niceDt = s => {
    if (!s) return '—';
    const d = parseLocalDate(s);
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getDate()).padStart(2,'0') + '-' + m[d.getMonth()] + '-' + String(d.getFullYear()).slice(-2);
  };

  // ── 1. Top header band (navy) ────────────────────────────────────────────
  let y = MT;
  fill(NAVY); pdf.rect(ML, y, CW, 16, 'F');
  // amber accent below navy bar
  fill(AMBER); pdf.rect(ML, y + 16, CW * 0.35, 0.8, 'F');
  fill(NAVY);  pdf.rect(ML + CW * 0.35, y + 16, CW * 0.65, 0.8, 'F');

  // Bright logo on the left side of the navy bar — height bumped ~10 px
  // (≈3 mm), width scaled to preserve aspect, vertically centred in the bar.
  try {
    const LOGO_W = 41, LOGO_H = 11;
    const logoPng = await qtLoadLogoPng(LOGO_W, LOGO_H);
    pdf.addImage(logoPng, 'PNG', ML + 1, y + (16 - LOGO_H) / 2, LOGO_W, LOGO_H, undefined, 'FAST');
  } catch (e) { console.warn('[qt] logo load failed', e); }

  y += 22;

  // ── 2. Hero band: doc-type heading + meta cards ─────────────────────────
  font(7, 'bold', AMBER);
  pdf.text('BRIGHT PRODUCTION & PRINTING', ML, y);
  font(20, 'bold', NAVY);
  pdf.text(q.docType.toUpperCase(), ML, y + 8);

  // Meta cards on the right (Date / Valid Until / Doc No)
  const cardW = 32, cardH = 11, cardGap = 1.5;
  const meta = [
    { label: 'DATE', value: niceDt(q.date), inverted: false },
  ];
  if (q.validUntil) meta.push({ label: 'VALID UNTIL', value: niceDt(q.validUntil), inverted: false });
  meta.push({ label: 'DOC NO.', value: qtDocNoFor(q, q.docType), inverted: true });

  let cx = ML + CW;
  for (let i = meta.length - 1; i >= 0; i--) {
    const m = meta[i];
    cx -= cardW;
    if (m.inverted) {
      fill(NAVY); pdf.roundedRect(cx, y - 3, cardW, cardH, 1.2, 1.2, 'F');
      font(5.5, 'bold', MUTE); pdf.text(m.label, cx + 2, y);
      font(8.5, 'bold', [255,255,255]); pdf.text(m.value, cx + 2, y + 4.5);
    } else {
      stroke([226, 232, 240]); fill([255,255,255]);
      pdf.roundedRect(cx, y - 3, cardW, cardH, 1.2, 1.2, 'FD');
      font(5.5, 'bold', MUTE); pdf.text(m.label, cx + 2, y);
      font(8.5, 'bold', TEXT); pdf.text(m.value, cx + 2, y + 4.5);
    }
    cx -= cardGap;
  }

  y += 14;

  // ── 3. Customer card (soft gray, 2-col grid) ─────────────────────────────
  const custH = 28;
  fill(BG_SOFT); pdf.roundedRect(ML, y, CW, custH, 2, 2, 'F');

  font(6, 'bold', MUTE);
  pdf.text('BILL TO', ML + 4, y + 4.5);

  const colW = (CW - 12) / 2;
  const fields = [
    ['CUSTOMER', q.customer || '—', 'PROJECT', q.project || '—'],
    ['ADDRESS', q.address || '—', 'CONTACT PERSON', q.contactPerson || '—'],
    ['OFFICE NUMBER', q.officeNumber || '—', 'CONTACT NUMBER', q.contactNumber || '—'],
    ['EMAIL', q.email || '—', '', ''],
  ];
  let fy = y + 9;
  for (const [l1, v1, l2, v2] of fields) {
    font(5.5, 'bold', MUTE);
    pdf.text(l1, ML + 4, fy);
    font(8.5, 'bold', NAVY);
    pdf.text(pdf.splitTextToSize(v1, colW - 4), ML + 4, fy + 3);
    if (l2) {
      font(5.5, 'bold', MUTE);
      pdf.text(l2, ML + 4 + colW + 4, fy);
      font(8.5, 'bold', NAVY);
      pdf.text(pdf.splitTextToSize(v2, colW - 4), ML + 4 + colW + 4, fy + 3);
    }
    fy += 4.8;
  }

  y += custH + 4;

  // ── 4. Items table (auto-paginates) ──────────────────────────────────────
  if (typeof pdf.autoTable !== 'function') {
    showToast('autotable plugin not loaded — check internet');
    return;
  }

  // Flatten any newlines/extra whitespace in the description so each item shows
  // on a single visual line (autotable will only wrap once the line truly
  // exceeds the column width).
  const flatDesc = s => (s || '').replace(/\s*\n+\s*/g, ' · ').replace(/\s{2,}/g, ' ').trim();
  // For Delivery Notes the rightmost column is a free-text STATUS instead of
  // a computed amount — same column slot, different label and value.
  const isDN = q.docType === 'Delivery Note';
  const lastColLabel = isDN ? 'STATUS' : 'AMOUNT';
  const bodyRows = q.items.map((it, i) => {
    const amt = (+it.qty||0) * (+it.unitPrice||0);
    return [
      i + 1,
      '',                           // photo cell (drawn in didDrawCell)
      flatDesc(it.description),
      it.qty,
      qtFmtAmount(it.unitPrice, q.currency),
      isDN ? (it.status || '—') : qtFmtAmount(amt, q.currency),
    ];
  });

  pdf.autoTable({
    startY: y,
    margin: { left: ML, right: MR, top: MT, bottom: MB },
    head: [['NO.', 'SAMPLE', 'DESCRIPTION', 'QTY', 'UNIT PRICE', lastColLabel]],
    body: bodyRows,
    styles: { fontSize: 8.5, cellPadding: 2.4, lineColor: [226, 232, 240], lineWidth: 0.15, valign: 'middle' },
    headStyles: { fillColor: NAVY, textColor: 255, fontSize: 7.5, fontStyle: 'bold', halign: 'center', cellPadding: 3 },
    columnStyles: {
      0: { halign: 'center', cellWidth: 13, textColor: MUTE,         fontStyle: 'bold' },
      1: { halign: 'center', cellWidth: 26, minCellHeight: 22 },
      2: { halign: 'left',   cellWidth: 'auto' },
      3: { halign: 'center', cellWidth: 16, fontStyle: 'bold' },
      4: { halign: 'right',  cellWidth: 26, textColor: [71,85,105] },
      5: isDN
        ? { halign: 'center', cellWidth: 30, fontStyle: 'bold', textColor: NAVY }
        : { halign: 'right',  cellWidth: 30, fontStyle: 'bold', textColor: TEXT },
    },
    alternateRowStyles: { fillColor: [248, 250, 252] },
    didDrawCell: (data) => {
      // Inject photo into the Sample column
      if (data.section === 'body' && data.column.index === 1) {
        const it = q.items[data.row.index];
        if (it && it.photoData) {
          try {
            const pad = 1.5;
            const w = data.cell.width - pad * 2;
            const h = data.cell.height - pad * 2;
            pdf.addImage(it.photoData, 'JPEG',
              data.cell.x + pad, data.cell.y + pad, w, h, undefined, 'FAST');
          } catch (e) { /* skip bad images */ }
        }
      }
    },
  });
  y = pdf.lastAutoTable.finalY + 4;

  // ── helpers for sections that need to fit on the same page ──
  const pageBreakIfNeeded = neededH => {
    if (y + neededH > PG_H - MB) { pdf.addPage(); y = MT; }
  };

  // ── 5. Totals (right-aligned with navy Grand Total card) ─────────────────
  pageBreakIfNeeded(28);
  const totW = 70;
  const totX = ML + CW - totW;
  const t = qtTotals(q);

  font(8.5, 'normal', [71, 85, 105]);
  pdf.text('Subtotal', totX + 2, y + 3.5);
  font(8.5, 'bold', TEXT);
  pdf.text(qtFmtAmount(t.sub, q.currency), totX + totW - 2, y + 3.5, { align: 'right' });

  stroke([226, 232, 240]);
  pdf.setLineWidth(0.15);
  pdf.line(totX, y + 6, totX + totW, y + 6);

  font(8.5, 'normal', [71, 85, 105]);
  pdf.text(`VAT (${q.vatRate}%)`, totX + 2, y + 9.5);
  font(8.5, 'bold', TEXT);
  pdf.text(qtFmtAmount(t.vat, q.currency), totX + totW - 2, y + 9.5, { align: 'right' });

  fill(NAVY); pdf.roundedRect(totX, y + 13, totW, 13, 2, 2, 'F');
  font(5.5, 'bold', MUTE);
  pdf.text('GRAND TOTAL', totX + 3, y + 17.5);
  font(6, 'normal', [203, 213, 225]);
  pdf.text(q.currency, totX + 3, y + 21);
  font(13, 'bold', [255,255,255]);
  pdf.text(qtFmtAmount(t.grand, q.currency), totX + totW - 3, y + 21, { align: 'right' });

  y += 30;

  // ── 6. Terms & conditions ────────────────────────────────────────────────
  // Use the user's selected T&C lines if present (editable multi-select in
  // the form). q.terms can be either the new [{text,checked}] shape or the
  // legacy array of strings. Filter to only checked / non-empty entries.
  let tcLines;
  if (Array.isArray(q.terms) && q.terms.length && typeof q.terms[0] === 'object') {
    tcLines = q.terms.filter(t => t.checked && (t.text || '').trim()).map(t => t.text);
  } else if (Array.isArray(q.terms)) {
    tcLines = q.terms.slice();
  } else {
    tcLines = (QT_TERMS[q.docType] || []).slice();
  }
  // Bank info is only relevant when money is being collected (Invoice / Receipt).
  // Quotation and Delivery Note hide it.
  const showBank = q.docType === 'Invoice' || q.docType === 'Receipt';
  if (showBank && q.bankName) {
    tcLines.push(`* Bank Name: ${q.bankName}`);
    tcLines.push(`* Account No.: ${q.accountNo}`);
    tcLines.push(`* Account Name: ${q.accountName || 'Bright Production and Printing Individual Enterprise'}`);
  }
  if (q.notes)    tcLines.push('* ' + q.notes);

  // Compute T&C block height
  const tcLabelH = 5;
  const tcBoxPad = 4;
  const tcLineH = 4.2;
  const wrapped = tcLines.map(l => pdf.splitTextToSize('• ' + l.replace(/^\*\s*/, ''), CW - tcBoxPad * 2));
  const tcBoxH = tcBoxPad * 2 + wrapped.reduce((n, ls) => n + ls.length, 0) * tcLineH;

  pageBreakIfNeeded(tcLabelH + 2 + tcBoxH);

  font(6, 'bold', MUTE);
  pdf.text('TERMS & CONDITIONS', ML, y + 3);
  y += tcLabelH;

  fill([250, 251, 252]); pdf.rect(ML, y, CW, tcBoxH, 'F');
  fill(AMBER); pdf.rect(ML, y, 1.2, tcBoxH, 'F');

  let tx = y + tcBoxPad + 2.5;
  font(8, 'normal', [71, 85, 105]);
  for (const lines of wrapped) {
    for (const line of lines) {
      pdf.text(line, ML + tcBoxPad, tx);
      tx += tcLineH;
    }
  }
  y += tcBoxH + 8;

  // ── 7. Signatures ────────────────────────────────────────────────────────
  // Even bigger signing area — 44 mm (2× the previous 22 mm) so a full
  // signature image plus a wet-ink stamp can sit comfortably above the line.
  const SIG_BOX_H = 44;
  pageBreakIfNeeded(SIG_BOX_H + 12);
  const sigLeft  = q.docType === 'Quotation' ? 'APPROVED BY'
                  : q.docType === 'Receipt'  ? 'RECEIVED BY'
                  : 'CUSTOMER SIGN';
  const sigW = (CW - 12) / 2;
  // Signature is ONLY applied to Quotations — Invoice, Delivery Note, and
  // Receipt are signed by hand at delivery/payment, so they leave the box
  // empty. For Quotations: q.signatureBlank → empty, otherwise per-record
  // upload → saved default → Bright logo.
  if (q.docType === 'Quotation' && !q.signatureBlank) {
    try {
      const sigSrc = q.signature || qtGetDefaultSig();
      if (sigSrc) {
        pdf.addImage(sigSrc, 'PNG', ML + sigW + 12 + 2, y, sigW - 4, SIG_BOX_H, undefined, 'FAST');
      } else {
        const sigLogo = await qtLoadLogoPng(sigW - 4, SIG_BOX_H);
        pdf.addImage(sigLogo, 'PNG', ML + sigW + 12 + 2, y, sigW - 4, SIG_BOX_H, undefined, 'FAST');
      }
    } catch (e) { /* skip bad image */ }
  }
  const sigLineY = y + SIG_BOX_H + 1;
  stroke(TEXT); pdf.setLineWidth(0.4);
  pdf.line(ML, sigLineY, ML + sigW, sigLineY);
  pdf.line(ML + sigW + 12, sigLineY, ML + CW, sigLineY);
  font(5.5, 'bold', MUTE);
  pdf.text(sigLeft, ML, sigLineY + 4);
  pdf.text('PREPARED BY', ML + sigW + 12, sigLineY + 4);
  font(8, 'bold', NAVY);
  pdf.text(q.customer || '—', ML, sigLineY + 7.5);
  pdf.text('BRIGHT PRODUCTION & PRINTING', ML + sigW + 12, sigLineY + 7.5);

  // ── Footer (drawn on every page) ─────────────────────────────────────────
  // Company address + contact info, plus a thin amber/navy accent strip,
  // applied AFTER all content is laid out so autotable's auto-pagination
  // doesn't leave any pages unfooted.
  const totalPages = pdf.internal.getNumberOfPages();
  const footY = PG_H - MB + 4; // start ~4 mm into the bottom margin
  for (let p = 1; p <= totalPages; p++) {
    pdf.setPage(p);
    // accent strip
    fill(AMBER); pdf.rect(ML, footY - 2, CW * 0.35, 0.6, 'F');
    fill(NAVY);  pdf.rect(ML + CW * 0.35, footY - 2, CW * 0.65, 0.6, 'F');
    // address line
    font(7, 'normal', [71, 85, 105]);
    pdf.text('Thongpong Village, Sikhodtabong District, Vientiane Lao PDR', ML + CW / 2, footY + 1.5, { align: 'center' });
    // tel + email
    font(7, 'normal', [100, 116, 139]);
    pdf.text('Tel 020 5559 7992  ·  020 9922 9939  ·  bright.propri@gmail.com', ML + CW / 2, footY + 5, { align: 'center' });
    // page number on the right (only show when >1 page)
    if (totalPages > 1) {
      font(6, 'normal', [148, 163, 184]);
      pdf.text(`${p} / ${totalPages}`, ML + CW, footY + 5, { align: 'right' });
    }
  }

  // ── Output + save via bridge ─────────────────────────────────────────────
  let blob;
  try {
    blob = pdf.output('blob');
  } catch (e) {
    showToast('PDF build failed: ' + e.message);
    console.error('[qt] pdf.output failed', e);
    return;
  }
  const b64 = await blobToBase64(blob);
  const safeCust = qtSafeFolder(q.customer);
  const safeProj = qtSafeFolder(q.project || 'Untitled Project');
  const safeDoc  = q.docType.replace(/\s+/g,'');
  const filename = `${qtDocNoFor(q, q.docType)}_${safeDoc}_${q.date || todayISO()}.pdf`;
  const result = await qtFetch('/api/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path: `${safeCust}/${safeProj}/${filename}`, contentBase64: b64 }),
  });
  if (result?.ok) {
    if (!q.generated.includes(q.docType)) q.generated.push(q.docType);
    console.log('[qt] PDF saved to', result.path, '·', result.size, 'bytes');
    return result.path;
  } else {
    showToast('Bridge offline — PDF could not be saved');
    console.error('[qt] save failed — is the bridge running on :7860?');
    return null;
  }
}

function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result.split(',')[1]); // strip "data:...;base64,"
    r.onerror = reject;
    r.readAsDataURL(blob);
  });
}

// Build the printable HTML for the chosen doc type — matches the BRIGHT
// template: full-width navy header bar, centered doc-type banner, customer
// info block on the left, 3 stacked date boxes on the right, navy-headed
// items table, green-highlighted grand total, T&C + signature blocks.
function qtBuildDocHtml(q) {
  const t = qtTotals(q);
  const esc = s => (s ?? '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // Date format on the doc itself: dd-MMM-yy (matches template, e.g. "17-Feb-26")
  const niceDate = s => {
    if (!s) return '';
    const d = parseLocalDate(s);
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return String(d.getDate()).padStart(2,'0') + '-' + months[d.getMonth()] + '-' + String(d.getFullYear()).slice(-2);
  };

  // Description: first non-empty line is rendered bold (item title), the rest
  // (typically bullet items the user types on subsequent lines) appear smaller.
  const descCell = it => {
    const lines = (it.description || '').split('\n');
    const firstIdx = lines.findIndex(l => l.trim());
    if (firstIdx === -1) return '';
    const head = lines[firstIdx];
    const tail = lines.slice(firstIdx + 1);
    return `<div style="font-weight:700;font-size:10px;line-height:1.25;margin-bottom:1px;word-break:break-word;">${esc(head)}</div>` +
      tail.filter(l => l.length).map(l => `<div style="font-size:9px;line-height:1.3;color:#1a1d23;word-break:break-word;">${esc(l)}</div>`).join('');
  };

  const lines = q.items.map((it, i) => {
    const amt = (+it.qty||0) * (+it.unitPrice||0);
    return `
      <tr>
        <td style="text-align:center;font-weight:700;">${i+1}</td>
        <td style="text-align:center;">${it.photoData ? `<img src="${it.photoData}" style="max-width:120px;max-height:120px;object-fit:contain;">` : ''}</td>
        <td style="vertical-align:top;line-height:1.5;">${descCell(it)}</td>
        <td style="text-align:center;">${it.qty}</td>
        <td style="text-align:right;">${qtFmtAmount(it.unitPrice, q.currency)}</td>
        <td style="text-align:right;">${qtFmtAmount(amt, q.currency)}</td>
      </tr>
    `;
  }).join('');

  // T&C + signature labels per doc type. Bank info is appended as extra T&C
  // bullets so the doc still surfaces payment info without a separate panel.
  const sigLeft  = q.docType === 'Quotation' ? 'Approved by :'
                 : q.docType === 'Receipt'   ? 'Received by :'

// Live preview of where this task will land in the schedule calendar, plus warning when dates conflict.
function updateTaskDatePreview() {
  const due = document.getElementById('f-due')?.value || '';
  const dl  = document.getElementById('f-dl')?.value  || '';
  const el  = document.getElementById('task-date-preview');
  if (!el) return;
  const pretty = s => parseLocalDate(s).toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  const relDays = s => { const n = daysUntil(s); return n === null ? '' : n < 0 ? ` · ${Math.abs(n)}d ago` : n === 0 ? ' · today' : ` · in ${n}d`; };
  const parts = [];
  if (dl)  parts.push(`<span style="color:var(--red);"><strong>DL</strong> ${pretty(dl)}<span style="color:var(--text-3);font-weight:500;">${relDays(dl)}</span></span>`);
  if (due && due !== dl) parts.push(`<span style="color:var(--blue);"><strong>DUE</strong> ${pretty(due)}<span style="color:var(--text-3);font-weight:500;">${relDays(due)}</span></span>`);
  let html;
  if (parts.length === 0) {
    html = `<span style="color:var(--text-3);">No date set — task will appear under <em>"No date set"</em> below the calendar.</span>`;
  } else {
    html = `<span style="color:var(--text-3);">Calendar:</span> ${parts.join(' &nbsp;·&nbsp; ')}`;
  }
  if (due && dl && due > dl) {
    html += `<br><span style="color:var(--red);font-weight:600;">⚠ Due date is after the deadline — check your dates.</span>`;
  } else if (due && dl && due === dl) {
    html += `<br><span style="color:var(--text-3);">Due and deadline are the same day — shown once as DL.</span>`;
  }
  el.innerHTML = html;
}

function setupSigPad(canvasId, kind) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  // Resize canvas to its container size
  c.width = c.offsetWidth || 280;
  c.height = c.offsetHeight || 90;
  const ctx = c.getContext('2d');
  ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.strokeStyle = '#1a1d23';
  const m = document.getElementById('modal');
  const dataKey = kind+'SigData';
  // Restore prior signature if present
  if (m.dataset[dataKey]) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, c.width, c.height);
    img.src = m.dataset[dataKey];
  }
  let drawing = false, lastX = 0, lastY = 0;
  function getPos(e) {
    const r = c.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return { x: t.clientX - r.left, y: t.clientY - r.top };
  }
  function start(e) { e.preventDefault(); drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; }
  function draw(e) {
    if (!drawing) return; e.preventDefault();
    const p = getPos(e);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }
  function end() {
    if (!drawing) return; drawing = false;
    m.dataset[dataKey] = c.toDataURL('image/png');
    c.classList.add('signed');
    updateSigUI(kind, true);
    updateCPFormStatus();
  }
  c.addEventListener('mousedown', start); c.addEventListener('mousemove', draw);
  c.addEventListener('mouseup', end); c.addEventListener('mouseleave', end);
  c.addEventListener('touchstart', start, {passive:false});
  c.addEventListener('touchmove', draw, {passive:false});
  c.addEventListener('touchend', end);
}
function updateSigUI(kind, signed) {
  const meta = document.querySelector(`#sig-${kind}`).parentElement.querySelector('.sig-meta span');
  if (meta) meta.textContent = (kind==='pic'?'PIC Sign':'Approval Sign') + (signed?' ✓':'');
}
function clearSig(kind) {
  const c = document.getElementById('sig-' + kind);
  if (!c) return;
  c.getContext('2d').clearRect(0, 0, c.width, c.height);
  c.classList.remove('signed');

function compressImage(img) {
  const max = 800;
  let w = img.width, hh = img.height;
  if (w > max || hh > max) { const r = max / Math.max(w, hh); w *= r; hh *= r; }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = hh;
  cv.getContext('2d').drawImage(img, 0, 0, w, hh);
  return cv.toDataURL('image/jpeg', 0.85);
}

  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => applyPhotoData(compressImage(img));
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  input.value = '';
}

function handlePhotoUrl() {
  const url = (window.prompt('Paste a direct image URL (.jpg, .png, etc.):') || '').trim();
  if (!url) return;
  showToast('Loading photo…');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      applyPhotoData(compressImage(img));
      showToast('Photo imported');
    } catch (e) {
      // Canvas tainted — host did not return CORS headers
      showToast('Image host blocks cross-origin — try a different link');

  };

})();
</script>
